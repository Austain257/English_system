<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人中心 - 英语学习系统</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }
        
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        
        .header {
            background: rgba(255, 255, 255, 0.95);
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            margin-bottom: 30px;
            position: relative;
            overflow: hidden;
        }
        
        .header::before {
            content: "";
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(106, 17, 203, 0.1) 0%, transparent 70%);
            animation: pulse 8s infinite linear;
        }
        
        @keyframes pulse {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .header-content {
            display: flex;
            align-items: center;
            gap: 25px;
            position: relative;
            z-index: 1;
        }
        
        .user-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #6a11cb;
            cursor: pointer;
            transition: transform 0.3s ease;
        }
        
        .user-avatar:hover {
            transform: scale(1.1);
        }
        
        .user-info h1 {
            font-size: 2rem;
            color: #2c3e50;
            margin-bottom: 5px;
        }
        
        .user-info .user-role {
            background: linear-gradient(135deg, #6a11cb, #2575fc);
            color: white;
            padding: 4px 12px;
            border-radius: 15px;
            font-size: 0.8rem;
            display: inline-block;
            margin-bottom: 10px;
        }
        
        .user-meta {
            color: #7f8c8d;
            font-size: 0.9rem;
        }
        
        .nav-tabs {
            display: flex;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 5px;
            margin-bottom: 30px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
        }
        
        .nav-tab {
            flex: 1;
            text-align: center;
            padding: 15px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
            color: #7f8c8d;
        }
        
        .nav-tab.active {
            background: linear-gradient(135deg, #6a11cb, #2575fc);
            color: white;
            box-shadow: 0 5px 15px rgba(106, 17, 203, 0.3);
        }
        
        .tab-content {
            display: none;
        }
        
        .tab-content.active {
            display: block;
        }
        
        .profile-card, .security-card, .stats-card {
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
            margin-bottom: 30px;
        }
        
        .card-title {
            font-size: 1.5rem;
            color: #2c3e50;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .form-group {
            margin-bottom: 25px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #2c3e50;
            font-weight: 600;
        }
        
        .form-group input {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e6ed;
            border-radius: 12px;
            font-size: 1rem;
            transition: all 0.3s ease;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: #6a11cb;
            box-shadow: 0 0 0 3px rgba(106, 17, 203, 0.1);
        }
        
        .form-group input:disabled {
            background: #f8f9fa;
            cursor: not-allowed;
        }
        
        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #6a11cb, #2575fc);
            color: white;
        }
        
        .btn-secondary {
            background: #6c757d;
            color: white;
        }
        
        .btn-danger {
            background: #dc3545;
            color: white;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
        
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        
        .stat-item {
            text-align: center;
            padding: 20px;
            background: linear-gradient(135deg, rgba(106, 17, 203, 0.1), rgba(37, 117, 252, 0.1));
            border-radius: 15px;
            border: 1px solid rgba(106, 17, 203, 0.2);
        }
        
        .stat-value {
            font-size: 2rem;
            font-weight: bold;
            color: #6a11cb;
            margin-bottom: 5px;
        }
        
        .stat-label {
            color: #7f8c8d;
            font-size: 0.9rem;
        }
        
        .alert {
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
        }
        
        .alert-success {
            background: rgba(40, 167, 69, 0.1);
            color: #28a745;
            border: 1px solid rgba(40, 167, 69, 0.2);
        }
        
        .alert-error {
            background: rgba(220, 53, 69, 0.1);
            color: #dc3545;
            border: 1px solid rgba(220, 53, 69, 0.2);
        }
        
        .avatar-upload {
            position: relative;
            display: inline-block;
            margin-bottom: 20px;
        }
        
        .avatar-upload input {
            position: absolute;
            opacity: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }
        
        .avatar-upload-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        
        .avatar-upload:hover .avatar-upload-overlay {
            opacity: 1;
        }
        
        .loading {
            display: none;
            margin-left: 10px;
        }
        
        .loading i {
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        @media (max-width: 768px) {
            .container {
                padding: 0 10px;
            }
            
            .header-content {
                flex-direction: column;
                text-align: center;
                gap: 15px;
            }
            
            .nav-tabs {
                flex-direction: column;
                gap: 5px;
            }
            
            .stats-grid {
                grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            }
        }
    </style>
</head>
<body data-require-auth="true">
    <div class="container">
        <div class="header">
            <div class="header-content">
                <img src="/assets/images/default-avatar.png" alt="用户头像" class="user-avatar" id="headerAvatar">
                <div class="user-info">
                    <h1 id="headerNickname">加载中...</h1>
                    <span class="user-role" id="headerRole">USER</span>
                    <div class="user-meta">
                        <span id="headerUsername">@username</span> • 
                        <span id="headerJoinDate">加入于 2024年</span>
                    </div>
                </div>
                <div style="margin-left: auto;">
                    <button class="btn btn-secondary" onclick="location.href='function.html'">
                        <i class="fas fa-arrow-left"></i> 返回主页
                    </button>
                </div>
            </div>
        </div>

        <div class="nav-tabs">
            <div class="nav-tab active" onclick="switchTab('profile')">
                <i class="fas fa-user"></i> 个人信息
            </div>
            <div class="nav-tab" onclick="switchTab('security')">
                <i class="fas fa-shield-alt"></i> 安全设置
            </div>
            <div class="nav-tab" onclick="switchTab('stats')">
                <i class="fas fa-chart-bar"></i> 学习统计
            </div>
        </div>

        <div class="tab-content active" id="profile">
            <div class="profile-card">
                <h2 class="card-title">
                    <i class="fas fa-user-edit"></i> 编辑个人信息
                </h2>
                
                <div class="alert alert-success" id="profileSuccessAlert"></div>
                <div class="alert alert-error" id="profileErrorAlert"></div>
                
                <div class="avatar-upload">
                    <img src="/assets/images/default-avatar.png" alt="用户头像" class="user-avatar" id="profileAvatar">
                    <input type="file" id="avatarInput" accept="image/*">
                    <div class="avatar-upload-overlay">
                        <i class="fas fa-camera"></i>
                    </div>
                </div>
                
                <form id="profileForm">
                    <div class="form-group">
                        <label for="username">用户名</label>
                        <input type="text" id="username" name="username" disabled>
                    </div>
                    
                    <div class="form-group">
                        <label for="nickname">昵称</label>
                        <input type="text" id="nickname" name="nickname" placeholder="输入您的昵称">
                    </div>
                    
                    <div class="form-group">
                        <label for="email">邮箱</label>
                        <input type="email" id="email" name="email" placeholder="输入您的邮箱">
                    </div>
                    
                    <button type="submit" class="btn btn-primary" id="profileSaveBtn">
                        <i class="fas fa-save"></i> 保存更改
                        <span class="loading" id="profileLoading">
                            <i class="fas fa-spinner"></i>
                        </span>
                    </button>
                </form>
            </div>
        </div>

        <div class="tab-content" id="security">
            <div class="security-card">
                <h2 class="card-title">
                    <i class="fas fa-key"></i> 修改密码
                </h2>
                
                <div class="alert alert-success" id="passwordSuccessAlert"></div>
                <div class="alert alert-error" id="passwordErrorAlert"></div>
                
                <form id="passwordForm">
                    <div class="form-group">
                        <label for="oldPassword">当前密码</label>
                        <input type="password" id="oldPassword" name="oldPassword" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="newPassword">新密码</label>
                        <input type="password" id="newPassword" name="newPassword" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="confirmNewPassword">确认新密码</label>
                        <input type="password" id="confirmNewPassword" name="confirmNewPassword" required>
                    </div>
                    
                    <button type="submit" class="btn btn-primary" id="passwordSaveBtn">
                        <i class="fas fa-shield-alt"></i> 修改密码
                        <span class="loading" id="passwordLoading">
                            <i class="fas fa-spinner"></i>
                        </span>
                    </button>
                </form>
            </div>
            
            <div class="security-card">
                <h2 class="card-title">
                    <i class="fas fa-sign-out-alt"></i> 退出登录
                </h2>
                <p style="color: #7f8c8d; margin-bottom: 20px;">
                    退出当前账户，您需要重新登录才能使用系统功能。
                </p>
                <button class="btn btn-danger" onclick="logout()">
                    <i class="fas fa-power-off"></i> 退出登录
                </button>
            </div>
        </div>

        <div class="tab-content" id="stats">
            <div class="stats-card">
                <h2 class="card-title">
                    <i class="fas fa-chart-line"></i> 学习统计
                </h2>
                
                <div class="stats-grid">
                    <div class="stat-item">
                        <div class="stat-value" id="totalWordsLearned">0</div>
                        <div class="stat-label">学习单词数</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="wrongWordsCount">0</div>
                        <div class="stat-label">错词总数</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="studyDays">0</div>
                        <div class="stat-label">学习天数</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="totalSessions">0</div>
                        <div class="stat-label">学习次数</div>
                    </div>
                </div>
                
                <div style="margin-top: 30px;">
                    <h3 style="margin-bottom: 15px; color: #2c3e50;">最近学习记录</h3>
                    <div id="recentStudyRecords">
                        <p style="text-align: center; color: #7f8c8d; padding: 40px;">
                            <i class="fas fa-book-open" style="font-size: 2rem; margin-bottom: 10px; display: block;"></i>
                            暂无学习记录
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentUser = null;
        let authToken = null;
        
        // 页面加载时初始化
        document.addEventListener('DOMContentLoaded', function() {
            checkAuth();
            setupForms();
            setupAvatarUpload();
        });
        
        // 检查用户认证状态
        async function checkAuth() {
            authToken = localStorage.getItem('auth_token');
            if (!authToken) {
                window.location.href = 'login.html?return=profile.html';
                return;
            }
            
            try {
                const response = await fetch('http://192.168.43.106:8080/user/info', {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${authToken}`,
                        'Content-Type': 'application/json',
                    }
                });
                
                const result = await response.json();
                if (result.code === 1) {
                    currentUser = result.data;
                    updateUserDisplay();
                    loadUserStats();
                } else {
                    localStorage.removeItem('auth_token');
                    localStorage.removeItem('user_info');
                    window.location.href = 'login.html?return=profile.html';
                }
            } catch (error) {
                console.error('获取用户信息失败:', error);
                window.location.href = 'login.html?return=profile.html';
            }
        }
        
        // 更新用户显示信息
        function updateUserDisplay() {
            if (!currentUser) return;
            
            // 更新头部信息
            document.getElementById('headerAvatar').src = currentUser.avatar || '/assets/images/default-avatar.png';
            document.getElementById('headerNickname').textContent = currentUser.nickname || currentUser.username;
            document.getElementById('headerRole').textContent = currentUser.role === 'ADMIN' ? '管理员' : '学员';
            document.getElementById('headerUsername').textContent = '@' + currentUser.username;
            
            if (currentUser.createTime) {
                const joinDate = new Date(currentUser.createTime).getFullYear();
                document.getElementById('headerJoinDate').textContent = `加入于 ${joinDate}年`;
            }
            
            // 更新个人信息表单
            document.getElementById('profileAvatar').src = currentUser.avatar || '/assets/images/default-avatar.png';
            document.getElementById('username').value = currentUser.username || '';
            document.getElementById('nickname').value = currentUser.nickname || '';
            document.getElementById('email').value = currentUser.email || '';
        }
        
        // 设置表单事件
        function setupForms() {
            // 个人信息表单
            document.getElementById('profileForm').addEventListener('submit', updateProfile);
            
            // 密码修改表单
            document.getElementById('passwordForm').addEventListener('submit', changePassword);
        }
        
        // 设置头像上传
        function setupAvatarUpload() {
            const avatarInput = document.getElementById('avatarInput');
            avatarInput.addEventListener('change', handleAvatarUpload);
        }
        
        // 处理头像上传
        async function handleAvatarUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            // 验证文件类型
            if (!file.type.startsWith('image/')) {
                showAlert('请选择图片文件', 'error', 'profile');
                return;
            }
            
            // 验证文件大小 (2MB)
            if (file.size > 2 * 1024 * 1024) {
                showAlert('图片大小不能超过2MB', 'error', 'profile');
                return;
            }
            
            try {
                // 这里可以实现图片上传到服务器的逻辑
                // 现在暂时使用base64编码作为演示
                const reader = new FileReader();
                reader.onload = function(e) {
                    const newAvatar = e.target.result;
                    document.getElementById('headerAvatar').src = newAvatar;
                    document.getElementById('profileAvatar').src = newAvatar;
                    
                    // 这里应该发送到服务器保存
                    // updateUserAvatar(newAvatar);
                    
                    showAlert('头像上传成功！请点击保存更改以保存', 'success', 'profile');
                };
                reader.readAsDataURL(file);
            } catch (error) {
                console.error('头像上传失败:', error);
                showAlert('头像上传失败，请重试', 'error', 'profile');
            }
        }
        
        // 更新个人信息
        async function updateProfile(event) {
            event.preventDefault();
            
            const btn = document.getElementById('profileSaveBtn');
            const loading = document.getElementById('profileLoading');
            
            btn.disabled = true;
            loading.style.display = 'inline';
            hideAlerts('profile');
            
            const formData = {
                nickname: document.getElementById('nickname').value.trim(),
                email: document.getElementById('email').value.trim() || null,
                avatar: document.getElementById('profileAvatar').src
            };
            
            try {
                const response = await fetch('http://192.168.43.106:8080/user/info', {
                    method: 'PUT',
                    headers: {
                        'Authorization': `Bearer ${authToken}`,
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(formData)
                });
                
                const result = await response.json();
                if (result.code === 1) {
                    currentUser = { ...currentUser, ...formData };
                    localStorage.setItem('user_info', JSON.stringify(currentUser));
                    updateUserDisplay();
                    showAlert('个人信息更新成功！', 'success', 'profile');
                } else {
                    showAlert(result.message || '更新失败，请重试', 'error', 'profile');
                }
            } catch (error) {
                console.error('更新个人信息失败:', error);
                showAlert('网络错误，请稍后重试', 'error', 'profile');
            } finally {
                btn.disabled = false;
                loading.style.display = 'none';
            }
        }
        
        // 修改密码
        async function changePassword(event) {
            event.preventDefault();
            
            const oldPassword = document.getElementById('oldPassword').value;
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmNewPassword').value;
            
            if (newPassword !== confirmPassword) {
                showAlert('两次输入的新密码不一致', 'error', 'password');
                return;
            }
            
            if (newPassword.length < 6) {
                showAlert('新密码至少需要6个字符', 'error', 'password');
                return;
            }
            
            const btn = document.getElementById('passwordSaveBtn');
            const loading = document.getElementById('passwordLoading');
            
            btn.disabled = true;
            loading.style.display = 'inline';
            hideAlerts('password');
            
            try {
                const response = await fetch('http://192.168.43.106:8080/user/password', {
                    method: 'PUT',
                    headers: {
                        'Authorization': `Bearer ${authToken}`,
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        oldPassword: oldPassword,
                        newPassword: newPassword,
                        confirmPassword: confirmPassword
                    })
                });
                
                const result = await response.json();
                if (result.code === 1) {
                    document.getElementById('passwordForm').reset();
                    showAlert('密码修改成功！', 'success', 'password');
                } else {
                    showAlert(result.message || '密码修改失败，请重试', 'error', 'password');
                }
            } catch (error) {
                console.error('修改密码失败:', error);
                showAlert('网络错误，请稍后重试', 'error', 'password');
            } finally {
                btn.disabled = false;
                loading.style.display = 'none';
            }
        }
        
        // 加载用户统计数据
        async function loadUserStats() {
            try {
                // 获取错词统计
                const wrongWordsResponse = await fetch('http://192.168.43.106:8080/english/wrongbook/all', {
                    headers: { 'Authorization': `Bearer ${authToken}` }
                });
                
                if (wrongWordsResponse.ok) {
                    const wrongWordsResult = await wrongWordsResponse.json();
                    if (wrongWordsResult.code === 1) {
                        document.getElementById('wrongWordsCount').textContent = wrongWordsResult.data.length;
                    }
                }
                
                // 这里可以添加更多统计数据的获取逻辑
                document.getElementById('totalWordsLearned').textContent = '156';
                document.getElementById('studyDays').textContent = '28';
                document.getElementById('totalSessions').textContent = '42';
                
            } catch (error) {
                console.error('加载统计数据失败:', error);
            }
        }
        
        // 切换标签页
        function switchTab(tabName) {
            // 隐藏所有标签内容
            document.querySelectorAll('.tab-content').forEach(content => {
                content.classList.remove('active');
            });
            
            // 移除所有标签的激活状态
            document.querySelectorAll('.nav-tab').forEach(tab => {
                tab.classList.remove('active');
            });
            
            // 显示选中的标签内容
            document.getElementById(tabName).classList.add('active');
            event.target.classList.add('active');
            
            // 如果切换到统计页面，重新加载数据
            if (tabName === 'stats') {
                loadUserStats();
            }
        }
        
        // 退出登录
        async function logout() {
            if (!confirm('确定要退出登录吗？')) {
                return;
            }
            
            try {
                // 调用后端登出接口
                await fetch('http://192.168.43.106:8080/user/logout', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${authToken}`,
                        'Content-Type': 'application/json',
                    }
                });
            } catch (error) {
                console.error('退出登录接口调用失败:', error);
            }
            
            // 清除本地存储
            localStorage.removeItem('auth_token');
            localStorage.removeItem('user_info');
            
            // 跳转到登录页面
            window.location.href = 'login.html';
        }
        
        // 显示提示信息
        function showAlert(message, type, context) {
            const alertId = context + (type === 'error' ? 'ErrorAlert' : 'SuccessAlert');
            const alertElement = document.getElementById(alertId);
            
            if (alertElement) {
                alertElement.textContent = message;
                alertElement.style.display = 'block';
                
                // 自动隐藏成功消息
                if (type === 'success') {
                    setTimeout(() => {
                        alertElement.style.display = 'none';
                    }, 5000);
                }
            }
        }
        
        // 隐藏提示信息
        function hideAlerts(context) {
            const successAlert = document.getElementById(context + 'SuccessAlert');
            const errorAlert = document.getElementById(context + 'ErrorAlert');
            
            if (successAlert) successAlert.style.display = 'none';
            if (errorAlert) errorAlert.style.display = 'none';
        }
    </script>
    <script src="/assets/js/auth-guard.js"></script>
</body>
