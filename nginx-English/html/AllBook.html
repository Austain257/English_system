<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>英语词汇学习系统 · 全部词书</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600&display=swap');

        :root {
            --bg-primary: #020817;
            --bg-secondary: #06142c;
            --glass: rgba(8, 17, 37, 0.65);
            --glass-border: rgba(255, 255, 255, 0.08);
            --text-primary: #f4f6fb;
            --text-secondary: #b4c3ff;
            --text-muted: #8c9abf;
            --accent: #7d74ff;
            --accent-strong: #f9b234;
            --chip-bg: rgba(255, 255, 255, 0.04);
            --chip-active: rgba(255, 255, 255, 0.12);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Space Grotesk', 'Noto Sans SC', 'HarmonyOS Sans SC', sans-serif;
            background: radial-gradient(circle at 15% 20%, rgba(125, 116, 255, 0.35), transparent 45%),
                        radial-gradient(circle at 80% 0%, rgba(249, 178, 52, 0.18), transparent 40%),
                        var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 32px 24px 64px;
            position: relative;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background-image: linear-gradient(115deg, rgba(255,255,255,0.04) 0%, transparent 60%),
                              url('data:image/svg+xml,%3Csvg width="160" height="160" viewBox="0 0 160 160" xmlns="http://www.w3.org/2000/svg"%3E%3Cpath d="M0 80h160M80 0v160" stroke="rgba(255,255,255,0.02)" stroke-width="1"/%3E%3C/svg%3E');
            pointer-events: none;
            z-index: -1;
        }

        .page-shell {
            max-width: 1280px;
            margin: 0 auto;
            width: 100%;
        }

        .glass-nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 18px;
            padding: 16px 22px;
            background: var(--glass);
            border: 1px solid var(--glass-border);
            border-radius: 18px;
            backdrop-filter: blur(18px);
            position: sticky;
            top: 16px;
            z-index: 10;
        }

        .brand-mark {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .brand-icon {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            background: linear-gradient(135deg, #7d74ff, #5be4ff);
            display: grid;
            place-items: center;
            color: #070b1c;
            font-size: 1.35rem;
        }

        .brand-label h1 {
            font-size: 1.15rem;
            font-weight: 600;
            letter-spacing: 0.04em;
        }

        .brand-label span {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .nav-links {
            display: flex;
            gap: 18px;
            flex-wrap: wrap;
        }

        .nav-links a {
            color: var(--text-secondary);
            text-decoration: none;
            font-weight: 500;
            padding: 6px 10px;
            border-radius: 999px;
            transition: color 0.2s ease, background 0.2s ease;
        }

        .nav-links a:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.08);
        }

        .auth-slot {
            min-width: 230px;
        }

        .hero {
            margin-top: 40px;
            padding: 48px clamp(20px, 6vw, 64px);
            background: linear-gradient(135deg, rgba(125, 116, 255, 0.25), rgba(5, 110, 255, 0.15));
            border-radius: 32px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            position: relative;
            overflow: hidden;
        }

        .hero::after {
            content: "";
            position: absolute;
            width: 180px;
            height: 180px;
            background: radial-gradient(circle, rgba(249, 178, 52, 0.8), transparent 65%);
            top: -40px;
            right: -40px;
            opacity: 0.3;
        }

        .hero h1 {
            font-size: clamp(2.1rem, 4vw, 3.2rem);
            line-height: 1.2;
            max-width: 600px;
        }

        .hero p {
            color: var(--text-secondary);
            margin-top: 16px;
            max-width: 520px;
            line-height: 1.6;
        }

        .hero-actions {
            margin-top: 32px;
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
        }

        .btn {
            border: none;
            border-radius: 999px;
            padding: 12px 28px;
            font-weight: 600;
            letter-spacing: 0.03em;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-size: 0.95rem;
        }

        .btn-primary {
            background: linear-gradient(120deg, #7d74ff, #5be4ff);
            color: #050b1f;
            box-shadow: 0 12px 30px rgba(93, 148, 255, 0.35);
        }

        .btn-ghost {
            background: transparent;
            color: var(--text-secondary);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .btn.loading {
            opacity: 0.7;
            pointer-events: none;
        }

        .dashboard {
            margin-top: 36px;
            display: grid;
            gap: 18px;
        }

        .stat-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 18px;
        }

        .stat-card {
            background: var(--glass);
            border: 1px solid var(--glass-border);
            border-radius: 22px;
            padding: 20px 24px;
            position: relative;
            overflow: hidden;
        }

        .stat-card::after {
            content: "";
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 85% 15%, rgba(255,255,255,0.08), transparent 40%);
            pointer-events: none;
        }

        .stat-card span {
            font-size: 0.85rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .stat-card strong {
            display: block;
            font-size: 2rem;
            margin: 12px 0 6px;
        }

        .stat-card small {
            color: var(--text-secondary);
        }

        .tool-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            align-items: center;
        }

        .search-field {
            flex: 1 1 280px;
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 16px;
            padding: 10px 14px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .search-field input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-primary);
            font-size: 1rem;
        }

        .chip-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .chip {
            border: none;
            border-radius: 999px;
            padding: 10px 18px;
            background: var(--chip-bg);
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 0.9rem;
            transition: background 0.2s ease;
        }

        .chip.active {
            background: var(--chip-active);
            color: #fff;
        }

        .book-section {
            margin-top: 28px;
        }

        .book-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 22px;
        }

        .book-card {
            background: linear-gradient(180deg, rgba(8, 18, 36, 0.85), rgba(3, 7, 14, 0.92));
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 26px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 18px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: transform 0.25s ease, border-color 0.25s ease;
        }

        .book-card::before {
            content: "";
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 15% 20%, rgba(93, 148, 255, 0.2), transparent 55%);
            opacity: 0;
            transition: opacity 0.25s ease;
        }

        .book-card:hover {
            transform: translateY(-6px);
            border-color: rgba(125, 116, 255, 0.6);
        }

        .book-card:hover::before {
            opacity: 1;
        }

        .book-card__cover {
            width: 100%;
            height: 180px;
            border-radius: 20px;
            background: linear-gradient(130deg, #7d74ff, #5be4ff);
            display: grid;
            place-items: center;
            color: #050b1f;
            font-size: 2.4rem;
            overflow: hidden;
            position: relative;
        }

        .book-card__cover.has-cover {
            background: transparent;
        }

        .book-card__cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .book-card__body h3 {
            font-size: 1.25rem;
            margin-bottom: 8px;
        }

        .book-card__body p {
            color: var(--text-muted);
            line-height: 1.5;
            font-size: 0.95rem;
        }

        .book-card__meta {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
        }

        .book-card__meta strong {
            display: block;
            font-size: 1.2rem;
            color: var(--text-primary);
            margin-top: 4px;
        }

        .badge {
            padding: 6px 12px;
            border-radius: 999px;
            font-size: 0.75rem;
            background: rgba(255, 255, 255, 0.08);
        }

        .badge-private {
            color: #ffadad;
            background: rgba(255, 173, 173, 0.12);
        }

        .badge-public {
            color: #7dffca;
            background: rgba(125, 255, 202, 0.12);
        }

        .empty-state {
            text-align: center;
            padding: 80px 20px;
            color: var(--text-secondary);
        }

        .empty-state h3 {
            font-size: 1.4rem;
            margin-bottom: 10px;
        }

        .skeleton-card {
            height: 320px;
            border-radius: 24px;
            background: linear-gradient(120deg, rgba(255,255,255,0.05), rgba(255,255,255,0.02));
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }

        .site-footer {
            margin-top: 60px;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        @media (max-width: 768px) {
            body {
                padding: 20px 16px 48px;
            }

            .glass-nav {
                flex-direction: column;
                align-items: flex-start;
            }

            .auth-slot {
                align-self: stretch;
                width: 100%;
            }

            .book-card__meta {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body data-require-auth="true">
    <div class="page-shell">
        <header class="glass-nav">
            <div class="brand-mark">
                <div class="brand-icon"><i class="fas fa-globe-asia"></i></div>
                <div class="brand-label">
                    <h1>英语智学平台</h1>
                    <span>词库 · 数据 · 个性化</span>
                </div>
            </div>
            <nav class="nav-links">
                <a href="/function">学习工作台</a>
                <a href="/wrongbook">错词本</a>
                <a href="/profile">个人中心</a>
            </nav>
            <div class="auth-slot" data-user-info-anchor="true"></div>
        </header>

        <section class="hero">
            <h1>从一本词书开始，构建你的英语语料宇宙</h1>
            <p>系统会根据词书词频、难度、练习进度实时生成学习曲线，帮助你保持持续的语言输入与输出效率。</p>
            <div class="hero-actions">
                <button id="refreshBooks" class="btn btn-primary"><i class="fas fa-rotate"></i> 同步词书</button>
                <a class="btn btn-ghost" href="/wrongbook"><i class="fas fa-book-open"></i> 快速复盘错词</a>
            </div>
        </section>

        <section class="dashboard">
            <div class="stat-grid">
                <article class="stat-card">
                    <span>词书总数</span>
                    <strong id="totalBooks">--</strong>
                    <small>实时关联账号</small>
                </article>
                <article class="stat-card">
                    <span>累计词汇</span>
                    <strong id="totalWords">--</strong>
                    <small>估算含重复词条</small>
                </article>
                <article class="stat-card">
                    <span>最近更新</span>
                    <strong id="lastUpdated">--</strong>
                    <small>以词书更新时间为准</small>
                </article>
            </div>

            <div class="tool-bar">
                <label class="search-field" for="bookSearch">
                    <i class="fas fa-search"></i>
                    <input id="bookSearch" type="search" placeholder="按名称或内容搜索词书...">
                </label>
                <div class="chip-group" role="listbox" aria-label="词书难度筛选">
                    <button class="chip active" data-level="all">全部</button>
                    <button class="chip" data-level="starter">轻松</button>
                    <button class="chip" data-level="intermediate">进阶</button>
                    <button class="chip" data-level="advanced">挑战</button>
                </div>
            </div>
        </section>

        <section class="book-section">
            <div class="book-grid" id="booksContainer" aria-live="polite">
                <div class="skeleton-card"></div>
                <div class="skeleton-card"></div>
                <div class="skeleton-card"></div>
            </div>
            <div class="empty-state" id="emptyState" hidden>
                <h3>暂未找到合适的词书</h3>
                <p id="emptyStateMessage">请尝试调整筛选条件或稍后再试。</p>
            </div>
        </section>

        <footer class="site-footer">
            © 2025 英语词汇学习系统 · 语料与学习效率的专业解决方案
        </footer>
    </div>

    <script>
        const API_BASE = 'http://localhost:8080';
        const state = {
            books: []
        };

        function buildAuthHeaders() {
            const token = localStorage.getItem('auth_token');
            return token ? { 'Authorization': `Bearer ${token}` } : {};
        }

        document.addEventListener('DOMContentLoaded', () => {
            const headers = buildAuthHeaders();
            if (!headers.Authorization) {
                alert('登录状态已失效，请重新登录后查看词书');
                window.location.href = '/login';
                return;
            }

            const booksContainer = document.getElementById('booksContainer');
            const emptyState = document.getElementById('emptyState');
            const emptyStateMessage = document.getElementById('emptyStateMessage');
            const totalBooksEl = document.getElementById('totalBooks');
            const totalWordsEl = document.getElementById('totalWords');
            const lastUpdatedEl = document.getElementById('lastUpdated');
            const refreshButton = document.getElementById('refreshBooks');
            const searchInput = document.getElementById('bookSearch');
            const levelChips = document.querySelectorAll('.chip-group .chip');

            const skeletonMarkup = () => Array.from({ length: 3 }).map(() => '<div class="skeleton-card"></div>').join('');

            const setLoading = (flag) => {
                refreshButton.classList.toggle('loading', flag);
                refreshButton.disabled = flag;
                if (flag) {
                    booksContainer.innerHTML = skeletonMarkup();
                    emptyState.hidden = true;
                }
            };

            const fetchBooks = () => {
                setLoading(true);
                fetch(`${API_BASE}/list`, { headers })
                    .then(response => {
                        if (!response.ok) {
                            throw new Error(`HTTP状态 ${response.status}`);
                        }
                        return response.json();
                    })
                    .then(data => {
                        if (data.code !== 1 || !Array.isArray(data.data)) {
                            throw new Error('服务端返回异常');
                        }
                        state.books = data.data;
                        if (!state.books.length) {
                            showEmptyState('暂无词书数据，请联系管理员或稍后再试。');
                            return;
                        }
                        updateStats(state.books);
                        applyFilters();
                    })
                    .catch(error => {
                        console.error('获取词书数据失败:', error);
                        showEmptyState('数据加载失败，请检查网络或稍后再试。');
                    })
                    .finally(() => setLoading(false));
            };

            const getWordCount = (book) => {
                if (book.wordCount) return book.wordCount;
                const match = (book.bookName || '').match(/(\d+)/);
                return match ? parseInt(match[1], 10) : null;
            };

            const getDifficultyKey = (book) => {
                const count = getWordCount(book);
                if (!count) return 'balanced';
                if (count > 500) return 'advanced';
                if (count > 300) return 'intermediate';
                return 'starter';
            };

            const getDifficultyLabel = (key) => ({
                starter: '轻松',
                intermediate: '进阶',
                advanced: '挑战',
                balanced: '适中'
            }[key] || '适中');

            const parseTimestamp = (value) => {
                if (!value) return null;
                const date = new Date(value);
                return Number.isNaN(date.getTime()) ? null : date;
            };

            const formatDate = (date) => `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;

            const updateStats = (books) => {
                totalBooksEl.textContent = books.length;
                const wordSum = books.reduce((sum, book) => sum + (getWordCount(book) || 0), 0);
                totalWordsEl.textContent = wordSum ? `${wordSum}+` : '—';
                const latest = books.reduce((latestDate, book) => {
                    const current = parseTimestamp(book.updatedAt || book.updated_at || book.createdAt || book.created_at);
                    return current && (!latestDate || current > latestDate) ? current : latestDate;
                }, null);
                lastUpdatedEl.textContent = latest ? formatDate(latest) : '刚刚';
            };

            const showEmptyState = (message) => {
                booksContainer.innerHTML = '';
                emptyState.hidden = false;
                emptyStateMessage.textContent = message;
            };

            const applyFilters = () => {
                const keyword = searchInput.value.trim().toLowerCase();
                const activeChip = document.querySelector('.chip-group .chip.active');
                const level = activeChip ? activeChip.dataset.level : 'all';

                const filtered = state.books.filter(book => {
                    const text = `${book.bookName || ''} ${book.description || ''}`.toLowerCase();
                    const matchKeyword = !keyword || text.includes(keyword);
                    const matchLevel = level === 'all' || getDifficultyKey(book) === level;
                    return matchKeyword && matchLevel;
                });

                if (!filtered.length) {
                    showEmptyState(keyword || level !== 'all'
                        ? '未找到匹配的词书，尝试修改搜索或筛选条件。'
                        : '当前账户暂无词书，请联系管理员或稍后重试。');
                    return;
                }

                emptyState.hidden = true;
                renderBooks(filtered);
            };

            const renderBooks = (books) => {
                booksContainer.innerHTML = '';
                books.forEach(book => {
                    const name = book.bookName || '未命名词书';
                    const description = book.description || '覆盖核心语料与真实语境，帮助你构建稳固的词汇体系。';
                    const count = getWordCount(book);
                    const difficultyKey = getDifficultyKey(book);
                    const difficultyLabel = getDifficultyLabel(difficultyKey);
                    const visibility = (book.visibility || '').toLowerCase();
                    const hasCover = Boolean(book.coverUrl);

                    const card = document.createElement('article');
                    card.className = 'book-card';
                    card.setAttribute('role', 'button');
                    card.setAttribute('tabindex', '0');
                    card.addEventListener('click', () => {
                        window.location.href = `/function?bookname=${encodeURIComponent(name)}`;
                    });

                    const cover = document.createElement('div');
                    cover.className = `book-card__cover ${hasCover ? 'has-cover' : ''}`;
                    if (hasCover) {
                        const img = document.createElement('img');
                        img.src = book.coverUrl;
                        img.alt = `${name} 封面`;
                        img.loading = 'lazy';
                        img.referrerPolicy = 'no-referrer';
                        img.onerror = () => {
                            img.remove();
                            cover.classList.remove('has-cover');
                            cover.innerHTML = '<i class="fas fa-book"></i>';
                        };
                        cover.appendChild(img);
                    } else {
                        cover.innerHTML = '<i class="fas fa-book"></i>';
                    }

                    const body = document.createElement('div');
                    body.className = 'book-card__body';
                    const titleRow = document.createElement('div');
                    titleRow.style.display = 'flex';
                    titleRow.style.justifyContent = 'space-between';
                    titleRow.style.alignItems = 'center';
                    titleRow.style.gap = '8px';

                    const title = document.createElement('h3');
                    title.textContent = name;
                    titleRow.appendChild(title);

                    if (visibility) {
                        const badge = document.createElement('span');
                        badge.className = `badge ${visibility === 'private' ? 'badge-private' : 'badge-public'}`;
                        badge.textContent = visibility === 'private' ? '私有' : '公共';
                        titleRow.appendChild(badge);
                    }

                    const desc = document.createElement('p');
                    desc.textContent = description;

                    body.appendChild(titleRow);
                    body.appendChild(desc);

                    const meta = document.createElement('div');
                    meta.className = 'book-card__meta';
                    meta.innerHTML = `
                        <div>词汇量<strong>${count ? `${count}+` : '—'}</strong></div>
                        <div>难度<strong>${difficultyLabel}</strong></div>
                        <div>代号<strong>${book.bookCode || 'N/A'}</strong></div>
                    `;

                    card.appendChild(cover);
                    card.appendChild(body);
                    card.appendChild(meta);
                    booksContainer.appendChild(card);
                });
            };

            refreshButton.addEventListener('click', fetchBooks);
            searchInput.addEventListener('input', () => applyFilters());
            levelChips.forEach(chip => {
                chip.addEventListener('click', () => {
                    document.querySelector('.chip-group .chip.active')?.classList.remove('active');
                    chip.classList.add('active');
                    applyFilters();
                });
            });

            fetchBooks();
        });
    </script>

    <!-- 用户信息组件与鉴权 -->
    <script src="/assets/js/auth-guard.js"></script>
    <script src="/assets/js/user-info.js"></script>
</body>
</html>
