    <div class="container" id="inputContainer">

                    id="startIndexInput" 
                    class="number-input"

                    min="0" 
                    value="0"
                >
                <input 
                    type="number" 
                    id="endIndexInput" 
                    class="number-input" 
                    placeholder="结束编号" 
                    min="1" 
                    value="10"
                >
            </div>
            <button id="generateBtn" class="btn btn-primary">生成文章</button>
        </div>
    </div>

    <div class="container" id="outputContainer" style="display: none;">
        <div class="header">
            <h1>📝 生成结果</h1>
            <p>AI正在为您创作...</p>
        </div>
        
        <div class="content">
            <div id="articleCard" class="article-card">
                <div id="articleContent" class="article-content"></div>
            </div>
            
            <button id="backBtn" class="btn btn-secondary">返回</button>
            
            <div id="statusMessage" class="status-message"></div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const startIndexInput = document.getElementById('startIndexInput');
            const endIndexInput = document.getElementById('endIndexInput');
            const generateBtn = document.getElementById('generateBtn');
            const backBtn = document.getElementById('backBtn');
            const articleContent = document.getElementById('articleContent');
            const statusMessage = document.getElementById('statusMessage');
            const inputContainer = document.getElementById('inputContainer');
            const outputContainer = document.getElementById('outputContainer');
            
            let eventSource = null;

            // 生成文章按钮点击事件
            generateBtn.addEventListener('click', function() {
                const startIndex = parseInt(startIndexInput.value);
                const endIndex = parseInt(endIndexInput.value);
                
                if (isNaN(startIndex) || startIndex < 0) {
                    alert('请输入有效的起始编号（≥0）');
                    return;
                }
                
                if (isNaN(endIndex) || endIndex <= startIndex) {
                    alert('结束编号必须大于起始编号');
                    return;
                }
                
                // 切换到输出视图
                inputContainer.style.display = 'none';
                outputContainer.style.display = 'block';
                
                // 清空之前的内容
                articleContent.textContent = '';
                showStatus('正在连接AI服务...', 'success');
                
                // 建立SSE连接
                const url = `http://192.168.43.106:8080/article/generation?beginIndex=${startIndex}&endIndex=${endIndex}`;
                
                eventSource = new EventSource(url);
                
                eventSource.onmessage = function(event) {
                    // 直接渲染后端返回的数据
                    articleContent.textContent += event.data;
                    // 自动滚动到底部
                    articleContent.scrollTop = articleContent.scrollHeight;
                    showStatus('正在接收数据...', 'success');
                };
                
                eventSource.onerror = function() {
                    showStatus('连接已关闭或发生错误', 'error');
                    if (eventSource) {
                        eventSource.close();
                    }
                };
                
                // 连接打开时的处理
                eventSource.onopen = function() {
                    showStatus('已连接到AI服务，开始生成内容...', 'success');
                };
            });
            
            // 返回按钮点击事件
            backBtn.addEventListener('click', function() {
                // 关闭SSE连接
                if (eventSource) {
                    eventSource.close();
                    eventSource = null;
                }
                
                // 切换回输入视图
                outputContainer.style.display = 'none';
                inputContainer.style.display = 'block';
            });
            
            // 显示状态消息
            function showStatus(message, type) {
                statusMessage.textContent = message;
                statusMessage.className = 'status-message';
                statusMessage.classList.add(type === 'success' ? 'status-success' : 'status-error');
            }
        });
    </script>
