<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>英语词汇背诵 - 移动端优化版</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            font-family: 'Inter', 'Poppins', 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: radial-gradient(140% 120% at 20% 20%, rgba(255,255,255,0.1), transparent 45%), linear-gradient(135deg, #0f172a 0%, #4338ca 55%, #1d4ed8 100%);
            min-height: 100vh;
            padding: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #0f172a;
        }
        
        .container {
            width: 100%;
            max-width: 820px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 22px;
            box-shadow: 0 20px 80px rgba(0,0,0,0.18);
            overflow: hidden;
            position: relative;
            backdrop-filter: blur(12px);
        }
        
        .container::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(124, 58, 237, 0.1), rgba(14, 165, 233, 0.08));
            pointer-events: none;
        }
        
        .header {
            background: linear-gradient(120deg, #312e81 0%, #6366f1 50%, #22d3ee 100%);
            color: white;
            padding: 28px 28px 24px;
            position: relative;
            overflow: hidden;
        }
        
        .header::after {
            content: '';
            position: absolute;
            width: 180px;
            height: 180px;
            background: radial-gradient(circle, rgba(255,255,255,0.25), transparent 60%);
            top: -40px;
            right: -20px;
            filter: blur(6px);
            opacity: 0.7;
        }
        
        .header-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            position: relative;
            z-index: 1;
        }
        
        .title {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        
        .title h1 {
            font-size: 1.6rem;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .title p {
            font-size: 0.95rem;
            opacity: 0.9;
        }
        
        .pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255,255,255,0.15);
            border: 1px solid rgba(255,255,255,0.2);
            color: #eef2ff;
            padding: 10px 14px;
            border-radius: 999px;
            font-weight: 600;
            backdrop-filter: blur(6px);
        }
        
        .control-panel {
            padding: 22px 24px;
            background: #f8fafc;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        
        .input-group {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
        }
        
        .number-input {
            width: 100%;
            padding: 14px 16px;
            border: 1.5px solid #cbd5e1;
            border-radius: 12px;
            font-size: 1rem;
            outline: none;
            min-height: 48px;
            transition: all 0.2s ease;
            background: white;
        }
        
        .number-input:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 4px rgba(99,102,241,0.15);
        }
        
        .btn {
            padding: 12px 16px;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 50px;
            gap: 8px;
        }
        
        .btn-primary {
            background: linear-gradient(120deg, #6366f1, #22d3ee);
            color: white;
            box-shadow: 0 10px 25px rgba(99,102,241,0.25);
        }
        
        .btn-ghost {
            background: white;
            color: #0f172a;
            border: 1.5px solid #e2e8f0;
        }
        
        .btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
        }
        
        .content {
            padding: 24px;
            text-align: center;
            position: relative;
        }
        
        .word-card {
            background: linear-gradient(145deg, #ffffff, #f8fafc);
            border-radius: 18px;
            padding: 26px 22px 22px;
            margin-bottom: 22px;
            min-height: 200px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            transition: all 0.3s ease;
            position: relative;
            box-shadow: 0 10px 35px rgba(15,23,42,0.06);
            border: 1px solid #e2e8f0;
        }
        
        .word {
            font-size: 2.4rem;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 10px;
            position: relative;
            padding-right: 50px;
            line-height: 1.2;
        }
        
        .pronounce {
            color: #475569;
            font-style: italic;
            font-size: 1.2rem;
            margin-bottom: 12px;
        }
        
        .chinese {
            color: #0f172a;
            font-size: 1.15rem;
            font-weight: 600;
            line-height: 1.6;
            margin-bottom: 14px;
        }
        
        .meta-row {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-top: 6px;
        }
        
        .badge {
            background: #eef2ff;
            color: #4338ca;
            padding: 8px 12px;
            border-radius: 999px;
            font-weight: 600;
            font-size: 0.95rem;
            display: inline-flex;
            gap: 8px;
            align-items: center;
        }
        
        .index-info {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            margin-top: 10px;
        }
        
        .index-info span {
            color: #475569;
            font-weight: 600;
        }
        
        .buttons {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            width: 100%;
            margin-top: 6px;
            gap: 12px;
        }
        
        .btn-secondary {
            background: #0f172a;
            color: white;
            border: 1.5px solid #0f172a;
        }
        
        .btn-secondary:hover {
            background: #111827;
        }
        
        .loading, .error {
            text-align: center;
            padding: 46px 20px;
            font-size: 1.05rem;
            color: #475569;
        }
        
        .error {
            color: #dc2626;
        }
        
        .speak-btn {
            position: absolute;
            top: 12px;
            right: 12px;
            background: #0f172a;
            border: none;
            border-radius: 14px;
            width: 46px;
            height: 46px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.25s;
            box-shadow: 0 10px 25px rgba(15,23,42,0.25);
            z-index: 10;
        }
        
        .speak-btn:hover {
            transform: translateY(-2px);
            background: linear-gradient(120deg, #4338ca, #0ea5e9);
        }
        
        .speak-btn:active {
            transform: scale(0.96);
        }
        
        .speak-icon {
            font-size: 1.2rem;
            color: white;
        }
        
        .mobile-hint {
            text-align: center;
            font-size: 0.92rem;
            color: #475569;
            padding: 14px 10px 4px;
            background: #f8fafc;
            border-top: 1px solid #e2e8f0;
        }
        
        .browser-warning {
            background: #fff8e6;
            border: 1px solid #fbbf24;
            border-radius: 12px;
            padding: 14px;
            margin: 16px 0 0;
            text-align: center;
            display: none;
        }
        
        .browser-warning.show {
            display: block;
        }
        
        .browser-warning p {
            margin-bottom: 8px;
            color: #92400e;
            font-weight: 600;
        }
        
        .browser-warning ul {
            text-align: left;
            padding-left: 22px;
            margin: 10px 0;
            color: #92400e;
        }
        
        .browser-warning li {
            margin-bottom: 6px;
        }
        
        @media (max-width: 640px) {
            body {
                padding: 16px;
            }
            
            .header {
                padding: 22px 18px;
            }
            
            .title h1 {
                font-size: 1.35rem;
            }
            
            .input-group {
                grid-template-columns: 1fr;
            }
            
            .word {
                font-size: 2rem;
            }
            
            .pronounce {
                font-size: 1.05rem;
            }
            
            .chinese {
                font-size: 1.05rem;
            }
            
            .buttons {
                gap: 10px;
            }
        }
    </style>
</head>
<body data-require-auth="true">
    <div class="container">
        <div class="header">
            <div class="header-top">
                <div class="title">
                    <h1><i class="fas fa-book-open"></i> 英语词汇学习</h1>
                    <p>精练高频词，巩固听说读写</p>
                </div>
                <div class="pill"><i class="fas fa-bolt"></i> 专注模式</div>
            </div>
        </div>
        
        <div class="control-panel">
            <div class="input-group">
                <input 
                    type="number" 
                    id="startIndexInput" 
                    class="number-input" 
                    placeholder="起始编号" 
                    min="0" 
                    value="0"
                >
                <input 
                    type="number" 
                    id="endIndexInput" 
                    class="number-input" 
                    placeholder="结束编号" 
                    min="1" 
                    value="50"
                >
            </div>
            <button id="loadWordsBtn" class="btn btn-primary">
                <i class="fas fa-download"></i> 加载词表
            </button>
        </div>
        
        <div class="content">
            <div id="wordCard" class="word-card">
                <div class="loading">请输入单词范围并点击加载</div>
            </div>
            
            <div class="buttons">
                <button id="prevWordBtn" class="btn btn-secondary">
                    <i class="fas fa-arrow-left"></i> 上一个
                </button>
                <button id="nextWordBtn" class="btn btn-secondary">
                    下一个 <i class="fas fa-arrow-right"></i>
                </button>
            </div>
            
            <div class="mobile-hint">
                提示：点击喇叭图标<i class="fas fa-volume-up" style="color:#6366f1; margin:0 6px;"></i>朗读单词
            </div>
            
            <div id="browserWarning" class="browser-warning">
                <p><i class="fas fa-exclamation-triangle"></i> 您的浏览器可能不支持语音朗读功能</p>
                <p>建议使用以下浏览器：</p>
                <ul>
                    <li>Chrome（安卓版）</li>
                    <li>Firefox（安卓版）</li>
                    <li>Microsoft Edge（安卓版）</li>
                </ul>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8080';

        function buildAuthHeaders() {
            const token = localStorage.getItem('auth_token');
            return token ? { 'Authorization': `Bearer ${token}` } : {};
        }

        document.addEventListener('DOMContentLoaded', function() {
            const startIndexInput = document.getElementById('startIndexInput');
            const endIndexInput = document.getElementById('endIndexInput');
            const loadWordsBtn = document.getElementById('loadWordsBtn');
            const wordCard = document.getElementById('wordCard');
            const prevWordBtn = document.getElementById('prevWordBtn');
            const nextWordBtn = document.getElementById('nextWordBtn');
            const browserWarning = document.getElementById('browserWarning');
            
            let words = [];
            let currentIndex = 0;
            let isSpeaking = false;
            let isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
            
            // 检测浏览器是否支持Web Speech API
            if (!('speechSynthesis' in window) || !('SpeechSynthesisUtterance' in window)) {
                browserWarning.classList.add('show');
            }
            
            // 加载单词按钮点击事件
            loadWordsBtn.addEventListener('click', loadWords);
            
            // 移动端键盘优化
            startIndexInput.addEventListener('focus', function() {
                setTimeout(() => {
                    window.scrollTo(0, 0);
                    document.body.scrollTop = 0;
                }, 100);
            });
            
            endIndexInput.addEventListener('focus', function() {
                setTimeout(() => {
                    window.scrollTo(0, 0);
                    document.body.scrollTop = 0;
                }, 100);
            });
            
            // 回车键支持
            startIndexInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    loadWords();
                }
            });
            
            endIndexInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    loadWords();
                }
            });
            
            // 上一个单词
            prevWordBtn.addEventListener('click', function() {
                if (words.length === 0) return;
                
                currentIndex = (currentIndex - 1 + words.length) % words.length;
                renderCurrentWord();
            });
            
            // 下一个单词
            nextWordBtn.addEventListener('click', function() {
                if (words.length === 0) return;
                
                currentIndex = (currentIndex + 1) % words.length;
                renderCurrentWord();
            });
            
            // 加载单词函数
            function loadWords() {
                const startIndex = parseInt(startIndexInput.value);
                const endIndex = parseInt(endIndexInput.value);
                
                if (isNaN(startIndex) || startIndex < 0) {
                    alert('请输入有效的起始编号（≥0）');
                    return;
                }
                
                if (isNaN(endIndex) || endIndex <= startIndex) {
                    alert('结束编号必须大于起始编号');
                    return;
                }
                
                // 获取课本名称参数
                const urlParams = new URLSearchParams(window.location.search);
                const bookname = urlParams.get('bookname');
                
                // 显示加载状态
                wordCard.innerHTML = '<div class="loading">正在加载词汇数据...</div>';
                
                const headers = buildAuthHeaders();
                if (!headers.Authorization) {
                    wordCard.innerHTML = '<div class="error">登录状态已失效，请重新登录后再试</div>';
                    window.location.href = '/login';
                    return;
                }

                // 构建带参数的URL
                let url = `${API_BASE}/english/recite?start=${startIndex}&end=${endIndex}`;
                if (bookname) {
                    url += `&bookname=${encodeURIComponent(bookname)}`;
                }
                
                fetch(url, { headers })
                    .then(response => {
                        if (!response.ok) {
                            throw new Error(`HTTP error! status: ${response.status}`);
                        }
                        return response.json();
                    })
                    .then(data => {
                        if (data.code !== 1 || !data.data || data.data.length === 0) {
                            wordCard.innerHTML = '<div class="error">暂无词汇数据</div>';
                            words = [];
                            return;
                        }
                        
                        words = data.data;
                        currentIndex = 0;
                        renderCurrentWord();
                    })
                    .catch(error => {
                        console.error('获取数据失败:', error);
                        wordCard.innerHTML = `
                            <div class="error">
                                <p>数据加载失败: ${error.message}</p>
                                <p>请检查后端服务是否已启动</p>
                            </div>
                        `;
                        words = [];
                    });
            }
            
            // 朗读单词函数 (移动端兼容)
            function speakWord(word) {
                // 检查浏览器是否支持Web Speech API
                if ('speechSynthesis' in window) {
                    // 如果正在朗读，先停止
                    if (isSpeaking) {
                        speechSynthesis.cancel();
                    }
                    
                    // 创建新的语音实例
                    const utterance = new SpeechSynthesisUtterance(word);
                    
                    // 设置语音属性
                    utterance.lang = 'en-US'; // 美式英语发音
                    utterance.rate = 0.9;     // 稍慢语速，适合学习
                    utterance.pitch = 1.0;    // 正常音调
                    utterance.volume = 1.0;   // 最大音量
                    
                    // 移动端事件处理
                    utterance.onstart = function() {
                        isSpeaking = true;
                        // 添加播放动画
                        const speakBtn = document.querySelector('.speak-btn');
                        if (speakBtn) {
                            speakBtn.innerHTML = '<i class="fas fa-volume-up speak-icon" style="color:#4facfe;"></i>';
                            speakBtn.classList.add('active');
                        }
                    };
                    
                    utterance.onend = function() {
                        isSpeaking = false;
                        // 恢复喇叭图标
                        const speakBtn = document.querySelector('.speak-btn');
                        if (speakBtn) {
                            speakBtn.innerHTML = '<i class="fas fa-volume-up speak-icon"></i>';
                            speakBtn.classList.remove('active');
                        }
                    };
                    
                    utterance.onerror = function(event) {
                        console.error('朗读错误:', event.error);
                        isSpeaking = false;
                        alert('朗读失败: ' + event.error);
                    };
                    
                    // 尝试使用高质量语音
                    const voices = speechSynthesis.getVoices();
                    let selectedVoice = null;
                    
                    // 优先选择移动端友好语音
                    const mobileFriendlyVoices = voices.filter(voice => 
                        voice.lang.startsWith('en') && 
                        (voice.name.includes('Google') || 
                         voice.name.includes('Samantha') || 
                         voice.name.includes('English') || 
                         voice.name.includes('Karen') || 
                         voice.name.includes('Daniel'))
                    );
                    
                    if (mobileFriendlyVoices.length > 0) {
                        selectedVoice = mobileFriendlyVoices[0];
                    } else if (voices.length > 0) {
                        selectedVoice = voices[0];
                    }
                    
                    if (selectedVoice) {
                        utterance.voice = selectedVoice;
                    }
                    
                    // 朗读单词
                    speechSynthesis.speak(utterance);
                } else {
                    alert('抱歉，您的浏览器不支持语音朗读功能。请尝试使用Chrome、Edge或Safari浏览器。');
                }
            }
            
            // 渲染当前单词
            function renderCurrentWord() {
                if (words.length === 0) return;
                
                const word = words[currentIndex];
                
                wordCard.innerHTML = `
                    <div class="word">${word.word}
                        <button class="speak-btn" title="朗读单词">
                            <i class="fas fa-volume-up speak-icon"></i>
                        </button>
                    </div>
                    <div class="pronounce">${word.pronounce}</div>
                    <div class="chinese">${word.chinese}</div>
                    <div class="times">出现 ${word.times} 次</div>
                    <div class="index-info">
                        <div class="current-index">第 ${currentIndex + 1} / ${words.length} 个单词</div>
                        <div class="total-words">共 ${words.length} 个单词</div>
                    </div>
                `;
                
                // 为朗读按钮添加事件监听器
                const speakButton = document.querySelector('.speak-btn');
                speakButton.addEventListener('click', () => {
                    speakWord(word.word);
                });
            }
            
            // iOS特殊处理 - 需要用户交互后初始化语音
            document.body.addEventListener('touchstart', initSpeechSynthesis, { once: true });
            document.body.addEventListener('click', initSpeechSynthesis, { once: true });
            
            function initSpeechSynthesis() {
                // 触发语音列表加载
                speechSynthesis.getVoices();
            }
        });
    </script>
    <script src="/assets/js/auth-guard.js"></script>
</body>
</html>
