<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能错词本</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            backdrop-filter: blur(10px);
        }
        
        .header {
            background: linear-gradient(135deg, #4a6ee0 0%, #6a11cb 100%);
            color: white;
            padding: 25px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        
        .header::before {
            content: "";
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
            animation: pulse 8s infinite linear;
        }
        
        @keyframes pulse {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
            position: relative;
            z-index: 1;
        }
        
        .header p {
            font-size: 1.2rem;
            opacity: 0.9;
            max-width: 600px;
            position: relative;
            z-index: 1;
            margin: 0 auto;
        }
        
        .stats-bar {
            display: flex;
            justify-content: space-around;
            padding: 20px;
            background: #f8f9fa;
            border-bottom: 1px solid #dee2e6;
            flex-wrap: wrap;
            gap: 15px;
        }
        
        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            flex: 1;
            min-width: 150px;
            transition: transform 0.3s ease;
        }
        
        .stat-card:hover {
            transform: translateY(-5px);
        }
        
        .stat-value {
            font-size: 2rem;
            font-weight: bold;
            color: #4a6ee0;
            margin-bottom: 5px;
        }
        
        .stat-label {
            color: #6c757d;
            font-size: 0.9rem;
        }
        
        .control-panel {
            padding: 25px;
            background: white;
            border-bottom: 1px solid #dee2e6;
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }
        
        .filter-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .filter-select {
            padding: 10px 15px;
            border: 2px solid #4a6ee0;
            border-radius: 10px;
            background: white;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
        }
        
        .filter-select:focus {
            border-color: #6a11cb;
            box-shadow: 0 0 0 3px rgba(106, 17, 203, 0.1);
        }
        
        .btn {
            padding: 12px 20px;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #4a6ee0, #6a11cb);
            color: white;
        }
        
        .btn-success {
            background: linear-gradient(135deg, #28a745, #20c997);
            color: white;
        }
        
        .btn-danger {
            background: linear-gradient(135deg, #dc3545, #e83e8c);
            color: white;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        
        .content {
            padding: 30px;
            min-height: 400px;
        }
        
        .word-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        
        .word-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
            border: 2px solid transparent;
            position: relative;
            overflow: hidden;
        }
        
        .word-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #4a6ee0, #6a11cb);
        }
        
        .word-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.15);
            border-color: #4a6ee0;
        }
        
        .word-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 15px;
        }
        
        .word-title {
            font-size: 1.8rem;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 5px;
        }
        
        .word-pronounce {
            color: #7f8c8d;
            font-style: italic;
            margin-bottom: 10px;
        }
        
        .word-meaning {
            color: #34495e;
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 15px;
            padding: 15px;
            background: rgba(74, 110, 224, 0.05);
            border-radius: 10px;
            border-left: 4px solid #4a6ee0;
        }
        
        .word-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
            color: #6c757d;
            margin-bottom: 15px;
        }
        
        .error-count {
            background: #ff6b6b;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.8rem;
        }
        
        .book-tag {
            background: #4a6ee0;
            color: white;
            padding: 4px 10px;
            border-radius: 15px;
            font-size: 0.8rem;
        }
        
        .word-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }
        
        .action-btn {
            padding: 8px 15px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }
        
        .action-btn.remove {
            background: #dc3545;
            color: white;
        }
        
        .action-btn.practice {
            background: #28a745;
            color: white;
        }
        
        .action-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 3px 10px rgba(0,0,0,0.2);
        }
        
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #6c757d;
        }
        
        .empty-state i {
            font-size: 4rem;
            margin-bottom: 20px;
            color: #dee2e6;
        }
        
        .empty-state h3 {
            font-size: 1.5rem;
            margin-bottom: 10px;
        }
        
        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 60px;
        }
        
        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #f3f3f3;
            border-top: 5px solid #4a6ee0;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        @media (max-width: 768px) {
            .container {
                margin: 10px;
                border-radius: 15px;
            }
            
            .header h1 {
                font-size: 2rem;
            }
            
            .stats-bar {
                flex-direction: column;
                gap: 10px;
            }
            
            .control-panel {
                flex-direction: column;
                align-items: stretch;
            }
            
            .word-grid {
                grid-template-columns: 1fr;
                gap: 15px;
            }
            
            .word-card {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1><i class="fas fa-book-open"></i> 智能错词本</h1>
            <p>系统管理你的错误单词，智能复习，高效记忆</p>
        </div>
        
        <div class="stats-bar">
            <div class="stat-card">
                <div class="stat-value" id="totalCount">0</div>
                <div class="stat-label">总错词数</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="frequentCount">0</div>
                <div class="stat-label">高频错词</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="bookCount">0</div>
                <div class="stat-label">涉及课本</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="todayCount">0</div>
                <div class="stat-label">今日新增</div>
            </div>
        </div>
        
        <div class="control-panel">
            <div class="filter-group">
                <label><i class="fas fa-filter"></i> 筛选条件:</label>
                <select class="filter-select" id="bookFilter">
                    <option value="all">全部课本</option>
                </select>
                <select class="filter-select" id="timesFilter">
                    <option value="0">全部错词</option>
                    <option value="2">错误2次以上</option>
                    <option value="3">错误3次以上</option>
                    <option value="5">错误5次以上</option>
                </select>
            </div>
            <div class="filter-group">
                <button class="btn btn-primary" onclick="refreshData()">
                    <i class="fas fa-sync-alt"></i> 刷新
                </button>
                <button class="btn btn-success" onclick="startPractice()">
                    <i class="fas fa-play"></i> 开始练习
                </button>
                <a href="/function" class="btn btn-danger">
                    <i class="fas fa-arrow-left"></i> 返回
                </a>
            </div>
        </div>
        
        <div class="content">
            <div class="loading" id="loading" style="display: none;">
                <div class="spinner"></div>
            </div>
            
            <div class="empty-state" id="emptyState" style="display: none;">
                <i class="fas fa-book-open"></i>
                <h3>还没有错词记录</h3>
                <p>在学习过程中答错的单词会自动添加到这里</p>
            </div>
            
            <div class="word-grid" id="wordGrid"></div>
        </div>
    </div>

    <script>
        let allWords = [];
        let currentFilter = { book: 'all', times: 0 };
        
        // 页面加载时初始化
        document.addEventListener('DOMContentLoaded', function() {
            loadBooks();
            loadWords();
            setupEventListeners();
        });
        
        // 设置事件监听器
        function setupEventListeners() {
            document.getElementById('bookFilter').addEventListener('change', function() {
                currentFilter.book = this.value;
                filterWords();
            });
            
            document.getElementById('timesFilter').addEventListener('change', function() {
                currentFilter.times = parseInt(this.value);
                filterWords();
            });
        }
        
        // 加载课本列表
        async function loadBooks() {
            try {
                const response = await fetch('http://192.168.43.106:8080/english/wrongbook/books');
                const result = await response.json();
                
                if (result.code === 1) {
                    const bookSelect = document.getElementById('bookFilter');
                    bookSelect.innerHTML = '<option value="all">全部课本</option>';
                    
                    result.data.forEach(book => {
                        const option = document.createElement('option');
                        option.value = book;
                        option.textContent = book;
                        bookSelect.appendChild(option);
                    });
                    
                    updateStats();
                }
            } catch (error) {
                console.error('加载课本列表失败:', error);
            }
        }
        
        // 加载错词数据
        async function loadWords() {
            showLoading(true);
            
            try {
                const response = await fetch('http://192.168.43.106:8080/english/wrongbook/all');
                const result = await response.json();
                
                if (result.code === 1) {
                    allWords = result.data || [];
                    filterWords();
                    updateStats();
                } else {
                    showEmpty();
                }
            } catch (error) {
                console.error('加载错词数据失败:', error);
                showEmpty();
            } finally {
                showLoading(false);
            }
        }
        
        // 过滤单词
        function filterWords() {
            let filteredWords = allWords;
            
            // 按课本过滤
            if (currentFilter.book !== 'all') {
                filteredWords = filteredWords.filter(word => word.bookname === currentFilter.book);
            }
            
            // 按错误次数过滤
            if (currentFilter.times > 0) {
                filteredWords = filteredWords.filter(word => (word.times || 0) >= currentFilter.times);
            }
            
            displayWords(filteredWords);
        }
        
        // 显示单词列表
        function displayWords(words) {
            const wordGrid = document.getElementById('wordGrid');
            const emptyState = document.getElementById('emptyState');
            
            if (!words || words.length === 0) {
                wordGrid.style.display = 'none';
                emptyState.style.display = 'block';
                return;
            }
            
            wordGrid.style.display = 'grid';
            emptyState.style.display = 'none';
            
            wordGrid.innerHTML = words.map(word => `
                <div class="word-card" data-word-id="${word.id}">
                    <div class="word-header">
                        <div>
                            <div class="word-title">${word.word}</div>
                            <div class="word-pronounce">${word.pronounce || '/'}</div>
                        </div>
                        <div class="error-count">错误 ${word.times || 1} 次</div>
                    </div>
                    
                    <div class="word-meaning">${word.chinese}</div>
                    
                    <div class="word-meta">
                        <span class="book-tag">${word.bookname || '未知'}</span>
                        <span>${formatDate(word.create_time)}</span>
                    </div>
                    
                    <div class="word-actions">
                        <button class="action-btn practice" onclick="practiceWord(${word.id}, '${word.word}')">
                            <i class="fas fa-play"></i> 练习
                        </button>
                        <button class="action-btn remove" onclick="removeWord(${word.id}, '${word.word}')">
                            <i class="fas fa-trash"></i> 删除
                        </button>
                    </div>
                </div>
            `).join('');
        }
        
        // 更新统计信息
        function updateStats() {
            document.getElementById('totalCount').textContent = allWords.length;
            
            const frequentWords = allWords.filter(word => (word.times || 1) >= 3);
            document.getElementById('frequentCount').textContent = frequentWords.length;
            
            const uniqueBooks = new Set(allWords.map(word => word.bookname)).size;
            document.getElementById('bookCount').textContent = uniqueBooks;
            
            const today = new Date().toDateString();
            const todayWords = allWords.filter(word => {
                const wordDate = new Date(word.create_time).toDateString();
                return wordDate === today;
            });
            document.getElementById('todayCount').textContent = todayWords.length;
        }
        
        // 删除单词
        async function removeWord(id, word) {
            if (!confirm(`确定要删除单词 "${word}" 吗？`)) {
                return;
            }
            
            try {
                const response = await fetch('http://192.168.43.106:8080/english/remove', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ id: id, word: word })
                });
                
                const result = await response.json();
                
                if (result.code === 1) {
                    // 从本地数据中删除
                    allWords = allWords.filter(w => w.id !== id);
                    filterWords();
                    updateStats();
                    alert('删除成功！');
                } else {
                    alert('删除失败：' + result.message);
                }
            } catch (error) {
                console.error('删除失败:', error);
                alert('删除失败，请重试');
            }
        }
        
        // 单词练习（增加错误次数）
        async function practiceWord(id, word) {
            try {
                const response = await fetch(`http://192.168.43.106:8080/english/wrongbook/increase?id=${id}`, {
                    method: 'POST'
                });
                
                const result = await response.json();
                
                if (result.code === 1) {
                    // 更新本地数据
                    const wordObj = allWords.find(w => w.id === id);
                    if (wordObj) {
                        wordObj.times = (wordObj.times || 1) + 1;
                        filterWords();
                        updateStats();
                    }
                    
                    alert(`单词 "${word}" 练习次数已记录`);
                } else {
                    alert('记录失败：' + result.message);
                }
            } catch (error) {
                console.error('练习记录失败:', error);
                alert('记录失败，请重试');
            }
        }
        
        // 开始练习模式
        function startPractice() {
            if (allWords.length === 0) {
                alert('暂无错词可以练习');
                return;
            }
            
            // 可以跳转到练习页面或者弹出练习模态框
            alert('练习功能即将开放，敬请期待！');
        }
        
        // 刷新数据
        function refreshData() {
            loadWords();
            loadBooks();
        }
        
        // 显示加载状态
        function showLoading(show) {
            document.getElementById('loading').style.display = show ? 'flex' : 'none';
        }
        
        // 显示空状态
        function showEmpty() {
            document.getElementById('wordGrid').style.display = 'none';
            document.getElementById('emptyState').style.display = 'block';
        }
        
        // 格式化日期
        function formatDate(dateString) {
            if (!dateString) return '未知时间';
            
            const date = new Date(dateString);
            const now = new Date();
            const diff = now - date;
            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            
            if (days === 0) return '今天';
            if (days === 1) return '昨天';
            if (days < 7) return `${days}天前`;
            
            return date.toLocaleDateString('zh-CN');
        }
    </script>
</body>
</html>
