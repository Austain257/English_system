<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能错词本</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            backdrop-filter: blur(10px);
        }
        
        .header {
            background: linear-gradient(135deg, #4a6ee0 0%, #6a11cb 100%);
            color: white;
            padding: 25px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        
        .header::before {
            content: "";
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
            animation: pulse 8s infinite linear;
        }
        
        @keyframes pulse {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
            position: relative;
            z-index: 1;
        }
        
        .header p {
            font-size: 1.2rem;
            opacity: 0.9;
            max-width: 600px;
            position: relative;
            z-index: 1;
            margin: 0 auto;
        }
        
        .stats-bar {
            display: flex;
            justify-content: space-around;
            padding: 20px;
            background: #f8f9fa;
            border-bottom: 1px solid #dee2e6;
            flex-wrap: wrap;
            gap: 15px;
        }
        
        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            flex: 1;
            min-width: 150px;
            transition: transform 0.3s ease;
        }
        
        .stat-card:hover {
            transform: translateY(-5px);
        }
        
        .stat-value {
            font-size: 2rem;
            font-weight: bold;
            color: #4a6ee0;
            margin-bottom: 5px;
        }
        
        .stat-label {
            color: #6c757d;
            font-size: 0.9rem;
        }
        
        .control-panel {
            padding: 25px;
            background: white;
            border-bottom: 1px solid #dee2e6;
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }
        
        .filter-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .filter-select {
            padding: 10px 15px;
            border: 2px solid #4a6ee0;
            border-radius: 10px;
            background: white;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
        }
        
        .filter-select:focus {
            border-color: #6a11cb;
            box-shadow: 0 0 0 3px rgba(106, 17, 203, 0.1);
        }
        
        .btn {
            padding: 12px 20px;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #4a6ee0, #6a11cb);
            color: white;
        }
        
        .btn-success {
            background: linear-gradient(135deg, #28a745, #20c997);
            color: white;
        }
        
        .btn-danger {
            background: linear-gradient(135deg, #dc3545, #e83e8c);
            color: white;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        
        .content {
            padding: 30px;
            min-height: 400px;
        }
        
        .word-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        
        .pagination-bar {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin: 24px 0 8px;
            flex-wrap: wrap;
        }
        
        .page-btn {
            min-width: 38px;
            padding: 10px 14px;
            border-radius: 10px;
            border: 1px solid #d6d9e0;
            background: #fff;
            color: #34495e;
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: 600;
        }
        
        .page-btn:hover {
            border-color: #4a6ee0;
            color: #4a6ee0;
            box-shadow: 0 8px 16px rgba(74, 110, 224, 0.12);
        }
        
        .page-btn.active {
            background: linear-gradient(135deg, #4a6ee0, #6a11cb);
            color: #fff;
            border-color: transparent;
            box-shadow: 0 10px 18px rgba(74, 110, 224, 0.25);
        }
        
        .page-info {
            font-size: 0.95rem;
            color: #6c757d;
            margin-left: 6px;
        }
        
        .word-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
            border: 2px solid transparent;
            position: relative;
            overflow: hidden;
        }
        
        .word-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #4a6ee0, #6a11cb);
        }
        
        .word-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.15);
            border-color: #4a6ee0;
        }
        
        .word-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 15px;
        }
        
        .word-title {
            font-size: 1.8rem;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 5px;
        }
        
        .word-pronounce {
            color: #7f8c8d;
            font-style: italic;
            margin-bottom: 10px;
        }
        
        .word-meaning {
            color: #34495e;
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 15px;
            padding: 15px;
            background: rgba(74, 110, 224, 0.05);
            border-radius: 10px;
            border-left: 4px solid #4a6ee0;
        }
        
        .word-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
            color: #6c757d;
            margin-bottom: 15px;
        }
        
        .error-count {
            background: #ff6b6b;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.8rem;
        }
        
        .book-tag {
            background: #4a6ee0;
            color: white;
            padding: 4px 10px;
            border-radius: 15px;
            font-size: 0.8rem;
        }
        
        .word-actions {
            display: flex;
            gap: 14px;
            justify-content: space-between;
            align-items: stretch;
        }
        
        .action-btn {
            flex: 1;
            padding: 10px 18px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            text-align: center;
        }
        
        .action-btn.remove {
            background: #dc3545;
            color: white;
        }
        
        .action-btn.practice {
            background: #28a745;
            color: white;
        }
        
        .action-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 3px 10px rgba(0,0,0,0.2);
        }
        
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #6c757d;
        }
        
        .empty-state i {
            font-size: 4rem;
            margin-bottom: 20px;
            color: #dee2e6;
        }
        
        .empty-state h3 {
            font-size: 1.5rem;
            margin-bottom: 10px;
        }
        
        .toast {
            position: fixed;
            top: 30px;
            right: 30px;
            background: rgba(42, 46, 65, 0.92);
            color: #fff;
            padding: 14px 18px;
            border-radius: 14px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            gap: 10px;
            opacity: 0;
            transform: translateY(-10px);
            transition: opacity 0.2s ease, transform 0.2s ease;
            z-index: 2000;
            font-size: 0.95rem;
        }

        .toast.show {
            opacity: 1;
            transform: translateY(0);
        }

        .toast i {
            font-size: 1rem;
        }

        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 60px;
        }
        
        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #f3f3f3;
            border-top: 5px solid #4a6ee0;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        @media (max-width: 768px) {
            .container {
                margin: 10px;
                border-radius: 15px;
            }
            
            .header h1 {
                font-size: 2rem;
            }
            
            .stats-bar {
                flex-direction: column;
                gap: 10px;
            }
            
            .control-panel {
                flex-direction: column;
                align-items: stretch;
            }
            
            .word-grid {
                grid-template-columns: 1fr;
                gap: 15px;
            }
            
            .word-card {
                padding: 20px;
            }
        }

        .study-overlay {
            position: fixed;
            inset: 0;
            background: rgba(13, 15, 36, 0.75);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 999;
            padding: 20px;
        }

        .study-panel {
            background: #fff;
            border-radius: 24px;
            max-width: 640px;
            width: 100%;
            padding: 30px;
            position: relative;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.35);
            overflow: hidden;
        }

        .study-panel::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(74,110,224,0.1), rgba(106,17,203,0.06));
            pointer-events: none;
        }

        .study-close {
            position: absolute;
            top: 18px;
            right: 18px;
            background: rgba(0,0,0,0.05);
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #555;
            transition: all 0.2s;
        }

        .study-close:hover {
            background: rgba(0,0,0,0.12);
            color: #000;
        }

        .study-progress {
            font-size: 0.95rem;
            color: #6c63ff;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .study-word-block {
            text-align: center;
            padding: 30px 10px 10px;
        }

        .study-word {
            font-size: 2.6rem;
            font-weight: 700;
            color: #222;
        }

        .study-pronounce {
            margin-top: 10px;
            color: #6c757d;
            font-size: 1.1rem;
        }

        .reveal-btn {
            margin-top: 22px;
            padding: 12px 30px;
            border-radius: 999px;
            border: 0;
            background: linear-gradient(120deg, #ff9a3c, #ffbc5a 55%, #ffe08a);
            color: #3c1b00;
            font-weight: 700;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 12px 25px rgba(255, 153, 51, 0.35);
            display: inline-flex;
            align-items: center;
            gap: 10px;
            position: relative;
            overflow: hidden;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .reveal-btn::after {
            content: '';
            position: absolute;
            inset: 2px;
            border-radius: inherit;
            background: linear-gradient(120deg, rgba(255,255,255,0.25), transparent 70%);
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .reveal-btn i {
            position: relative;
            z-index: 1;
            font-size: 1rem;
        }

        .reveal-btn span {
            position: relative;
            z-index: 1;
        }

        .reveal-btn:hover {
            transform: translateY(-2px) scale(1.01);
            box-shadow: 0 18px 35px rgba(255, 153, 51, 0.4);
        }

        .reveal-btn:hover::after {
            opacity: 1;
        }

        .reveal-btn:active {
            transform: translateY(0);
            box-shadow: 0 10px 20px rgba(255, 153, 51, 0.35);
        }

        .study-meaning {
            margin-top: 20px;
            font-size: 1.2rem;
            color: #2c3e50;
            background: rgba(74, 110, 224, 0.08);
            padding: 18px;
            border-radius: 16px;
            line-height: 1.6;
            display: none;
        }

        .study-meta {
            display: flex;
            justify-content: space-between;
            margin-top: 25px;
            color: #6c757d;
            font-size: 0.95rem;
        }

        .study-meta span {
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .study-actions {
            margin-top: 28px;
            display: flex;
            gap: 15px;
        }

        .study-btn {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 12px;
            color: #fff;
            font-size: 1.05rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .study-btn.known {
            background: linear-gradient(135deg, #28a745, #48db71);
        }

        .study-btn.unknown {
            background: linear-gradient(135deg, #ff5f6d, #ffc371);
        }

        .study-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(0,0,0,0.18);
        }

        .study-summary {
            margin-top: 25px;
            text-align: center;
            color: #4a6ee0;
            font-size: 1.05rem;
            display: none;
        }

        .study-summary strong {
            font-size: 1.3rem;
            display: block;
            margin-bottom: 6px;
        }

        .study-empty {
            text-align: center;
            color: #dee2e6;
            font-size: 1rem;
            margin-top: 30px;
        }

        body.study-lock {
            overflow: hidden;
        }
    </style>
</head>
<body data-require-auth="true" data-track-scene="WRONG_WORD" data-track-source="web_wrong_book">
    <div class="container">
        <div class="header">
            <h1><i class="fas fa-book-open"></i> 智能错词本</h1>
            <p>系统管理你的错误单词，智能复习，高效记忆</p>
        </div>
    <div class="toast" id="toast">
        <i class="fas fa-check-circle"></i>
        <span id="toastMessage">操作成功</span>
    </div>
        
        <div class="stats-bar">
            <div class="stat-card">
                <div class="stat-value" id="totalCount">0</div>
                <div class="stat-label">总错词数</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="frequentCount">0</div>
                <div class="stat-label">高频错词</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="bookCount">0</div>
                <div class="stat-label">涉及课本</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="todayCount">0</div>
                <div class="stat-label">今日新增</div>
            </div>
        </div>
        
        <div class="control-panel">
            <div class="filter-group">
                <label><i class="fas fa-filter"></i> 筛选条件:</label>
                <select class="filter-select" id="bookFilter">
                    <option value="all">全部课本</option>
                </select>
                <select class="filter-select" id="timesFilter">
                    <option value="0">全部错词</option>
                    <option value="2">错误2次以上</option>
                    <option value="3">错误3次以上</option>
                    <option value="5">错误5次以上</option>
                </select>
            </div>
            <div class="filter-group">
                <button class="btn btn-primary" onclick="refreshData()">
                    <i class="fas fa-sync-alt"></i> 刷新
                </button>
                <button class="btn btn-success" onclick="startPractice()">
                    <i class="fas fa-play"></i> 开始练习
                </button>
                <a href="/index.html" class="btn btn-danger">
                    <i class="fas fa-arrow-left"></i> 返回
                </a>
            </div>
        </div>
        
        <div class="content">
            <div class="loading" id="loading" style="display: none;">
                <div class="spinner"></div>
            </div>
            
            <div class="empty-state" id="emptyState" style="display: none;">
                <i class="fas fa-book-open"></i>
                <h3>还没有错词记录</h3>
                <p>在学习过程中答错的单词会自动添加到这里</p>
            </div>
            
            <div class="word-grid" id="wordGrid"></div>
            <div class="pagination-bar" id="paginationBar"></div>
            <div class="pagination-bar" id="paginationInfo" style="margin-top:0;"></div>
        </div>
    </div>

    <div class="study-overlay" id="studyOverlay">
        <div class="study-panel">
            <button class="study-close" onclick="closeStudySession()"><i class="fas fa-times"></i></button>
            <div class="study-progress" id="studyProgressText">错词学习</div>
            <div class="study-word-block" id="studyWordBlock">
                <div class="study-word" id="studyWord">apple</div>
                <div class="study-pronounce" id="studyPronounce">/ˈæpl/</div>
                <button class="reveal-btn" id="revealButton" onclick="revealMeaning()">
                    <i class="fas fa-eye"></i> <span></span>显示释义</span>
                </button>
                <div class="study-meaning" id="studyMeaning">示例释义</div>
            </div>
            <div class="study-meta">
                <span><i class="fas fa-book"></i> <span id="studyBook">默认课本</span></span>
                <span><i class="fas fa-redo"></i> <span id="studyTimes">错误 1 次</span></span>
            </div>
            <div class="study-actions" id="studyActions">
                <button class="study-btn known" onclick="handleStudyResult(true)">
                    <i class="fas fa-check"></i> 记住了
                </button>
                <button class="study-btn unknown" onclick="handleStudyResult(false)">
                    <i class="fas fa-sync"></i> 还不会
                </button>
            </div>
            <div class="study-summary" id="studySummary">
                <strong>本轮学习完成</strong>
                <p>继续保持，下次将自动为你挑选新的错词</p>
                <button class="btn btn-primary" style="margin-top:15px;" onclick="startStudySession()">再来一轮</button>
            </div>
            <div class="study-empty" id="studyEmpty" style="display:none;">
                当前筛选下已没有错词需要学习
            </div>
        </div>
    </div>

    <script src="/assets/js/learning-tracker.js"></script>
    <script>
        const API_BASE = 'http://localhost:8080';
        const STUDY_BATCH_SIZE = 8;
        const TRACKER_SCENE = 'WRONG_WORD';
        const TRACKER_SOURCE = 'web_wrong_book';
        let trackerActive = false;

        function ensureTrackerStarted() {
            if (trackerActive || !window.LearningTracker) return;
            window.LearningTracker.trackPageSession({
                scene: TRACKER_SCENE,
                source: TRACKER_SOURCE
            });
            trackerActive = true;
        }

        function endTrackerSession() {
            if (!trackerActive || !window.LearningTracker) return;
            window.LearningTracker.endSession();
            trackerActive = false;
        }
        let allWords = [];
        let currentFilter = { book: 'all', times: 0 };
        let studyWords = [];
        let studyIndex = 0;
        let studyStats = { completed: 0, known: 0, unknown: 0 };
        let meaningRevealed = false;
        const paginationState = { currentPage: 1, pageSize: 9, totalPages: 1, total: 0 };

        function recordWordMastery(word, mastered = true) {
            if (!window.LearningTracker || !word) return;
            const bookName = word.bookname || document.body.dataset.bookName || '错词本';
            LearningTracker.setBookContext({
                bookName,
                wordBank: bookName,
                bookId: word.bookId
            });
            const payload = {
                wordId: word.id,
                wordText: word.word,
                bookName,
                wordBank: bookName,
                proficiencyScore: mastered ? 100 : 40,
                mastered
            };
            const runner = mastered ? LearningTracker.markMastery(payload) : LearningTracker.regressMastery(payload);
            if (runner && typeof runner.catch === 'function') {
                runner.catch(err => console.warn('掌握状态上报失败', err));
            }
        }
        
        // 页面加载时初始化
        document.addEventListener('DOMContentLoaded', function() {
            loadBooks();
            loadWords(true);
            setupEventListeners();
        });
        
        function getToken() {
            const token = localStorage.getItem('auth_token');
            if (!token) {
                window.location.href = '/login?return=wrongbook';
            }
            return token;
        }
        
        // 设置事件监听器
        function setupEventListeners() {
            document.getElementById('bookFilter').addEventListener('change', function() {
                currentFilter.book = this.value;
                loadWords(true);
            });
            
            document.getElementById('timesFilter').addEventListener('change', function() {
                currentFilter.times = parseInt(this.value);
                loadWords(true);
            });
        }

        function updateStats(serverData) {
            const totalEl = document.getElementById('totalCount');
            const frequentEl = document.getElementById('frequentCount');
            const bookEl = document.getElementById('bookCount');
            const todayEl = document.getElementById('todayCount');

            if (serverData) {
                totalEl.textContent = serverData.total ?? 0;
                frequentEl.textContent = serverData.frequentCount ?? 0;
                bookEl.textContent = serverData.bookCount ?? 0;
                todayEl.textContent = serverData.todayCount ?? 0;
                return;
            }

            totalEl.textContent = paginationState.total ?? 0;
            if (frequentEl && frequentEl.textContent === '') frequentEl.textContent = '0';
            if (bookEl && bookEl.textContent === '') bookEl.textContent = '0';
            if (todayEl && todayEl.textContent === '') todayEl.textContent = '0';
        }
        
        // 加载课本列表
        async function loadBooks() {
            const token = getToken();
            if (!token) return;
            try {
                const response = await fetch(`${API_BASE}/english/wrongbook/books`, {
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });
                const result = await response.json();
                
                if (result.code === 1) {
                    const bookSelect = document.getElementById('bookFilter');
                    bookSelect.innerHTML = '<option value="all">全部课本</option>';
                    
                    result.data.forEach(book => {
                        const option = document.createElement('option');
                        option.value = book;
                        option.textContent = book;
                        bookSelect.appendChild(option);
                    });
                    
                    updateStats();
                }
            } catch (error) {
                console.error('加载课本列表失败:', error);
            }
        }
        
        // 加载错词数据（后端分页）
        async function loadWords(resetPage = false) {
            const token = getToken();
            if (!token) return;
            if (resetPage) paginationState.currentPage = 1;
            showLoading(true);
            
            try {
                const query = new URLSearchParams({
                    page: paginationState.currentPage,
                    size: paginationState.pageSize,
                    bookname: currentFilter.book,
                    minTimes: currentFilter.times
                }).toString();
                const response = await fetch(`${API_BASE}/english/wrongbook/page?${query}`, {
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });
                const result = await response.json();
                
                if (result.code === 1 && result.data) {
                    allWords = result.data.records || [];
                    paginationState.total = result.data.total || 0;
                    paginationState.totalPages = paginationState.total > 0 ? Math.ceil(paginationState.total / paginationState.pageSize) : 1;
                    displayWords(allWords, allWords.length === 0);
                    renderPagination(paginationState.total);
                    updateStats(result.data);
                } else {
                    showEmpty();
                }
            } catch (error) {
                console.error('加载错词数据失败:', error);
                showEmpty();
            } finally {
                showLoading(false);
            }
        }
        
        // 显示单词列表
        function displayWords(words, isEmpty = false) {
            const wordGrid = document.getElementById('wordGrid');
            const emptyState = document.getElementById('emptyState');
            
            if (isEmpty || !words || words.length === 0) {
                wordGrid.style.display = 'none';
                emptyState.style.display = 'block';
                return;
            }
            
            wordGrid.style.display = 'grid';
            emptyState.style.display = 'none';
            
            wordGrid.innerHTML = words.map(word => `
                <div class="word-card" data-word-id="${word.id}">
                    <div class="word-header">
                        <div>
                            <div class="word-title">${word.word}</div>
                            <div class="word-pronounce">${word.pronounce || '/'}</div>
                        </div>
                        <div class="error-count">错误 ${word.times || 1} 次</div>
                    </div>
                    
                    <div class="word-meaning">${word.chinese}</div>
                    
                    <div class="word-meta">
                        <span class="book-tag">${word.bookname || '未知'}</span>
                        <span>${formatDateValue(word.createTime)}</span>
                    </div>
                    
                    <div class="word-actions">
                        <button class="action-btn practice" onclick="practiceWord(${word.id}, '${word.word}')">
                            <i class="fas fa-play"></i> 我不会
                        </button>
                        <button class="action-btn remove" data-remove-btn="${word.id}" onclick="scheduleRemove(${word.id}, '${word.word}', '${word.bookname || ''}')">
                            <i class="fas fa-trash"></i> 小意思
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function renderPagination(totalItems) {
            const bar = document.getElementById('paginationBar');
            const info = document.getElementById('paginationInfo');
            if (totalItems <= paginationState.pageSize) {
                bar.innerHTML = '';
                info.textContent = '';
                return;
            }
            let html = '';
            const { currentPage, totalPages } = paginationState;
            const createBtn = (page, label, disabled = false, active = false) => {
                if (disabled) return '';
                return `<button class="page-btn ${active ? 'active' : ''}" data-page="${page}">${label}</button>`;
            };
            html += createBtn(currentPage - 1, '上一页', currentPage === 1);
            const startPage = Math.max(1, currentPage - 2);
            const endPage = Math.min(totalPages, currentPage + 2);
            for (let i = startPage; i <= endPage; i++) {
                html += createBtn(i, i, false, i === currentPage);
            }
            html += createBtn(currentPage + 1, '下一页', currentPage === totalPages);
            bar.innerHTML = html;
            info.innerHTML = `<span class="page-info">共 ${totalItems} 条 · 第 ${currentPage} / ${totalPages} 页</span>`;
            bar.querySelectorAll('.page-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const target = parseInt(btn.getAttribute('data-page'));
                    if (!Number.isNaN(target) && target !== paginationState.currentPage) {
                        paginationState.currentPage = target;
                        loadWords();
                    }
                });
            });
        }
        
        function filterWords() {
            const hasWords = Array.isArray(allWords) && allWords.length > 0;
            if (!hasWords) {
                if (paginationState.currentPage > 1) {
                    paginationState.currentPage = Math.max(1, paginationState.currentPage - 1);
                    loadWords();
                    return;
                }
                displayWords([], true);
            } else {
                displayWords(allWords, false);
            }
            renderPagination(paginationState.total);
        }
        
        // 延时删除队列
        const pendingRemovals = new Map();
        
        function scheduleRemove(id, word, bookname = '') {
            // 已处于待删除，则本次点击视为撤销
            if (pendingRemovals.has(id)) {
                cancelPendingRemoval(id);
                return;
            }
            const btn = document.querySelector(`[data-remove-btn="${id}"]`);
            if (btn) {
                btn.classList.add('undo-state');
                btn.innerHTML = '<i class="fas fa-undo"></i> 撤销';
            }
            const timer = setTimeout(() => {
                pendingRemovals.delete(id);
                performRemove(id, word, bookname);
            }, 5000);
            pendingRemovals.set(id, { timer, word, bookname });
        }
        
        function cancelPendingRemoval(id) {
            const pending = pendingRemovals.get(id);
            if (!pending) return false;
            clearTimeout(pending.timer);
            pendingRemovals.delete(id);
            restoreRemoveButton(id);
            showToast('已取消删除');
            return true;
        }
        
        function restoreRemoveButton(id) {
            const btn = document.querySelector(`[data-remove-btn="${id}"]`);
            if (btn) {
                btn.classList.remove('undo-state');
                btn.innerHTML = '<i class="fas fa-trash"></i> 小意思';
            }
        }
        
        // 删除单词（最终执行）
        async function performRemove(id, word, bookname = '') {
            try {
                await markMasteredBeforeRemove(id, word, bookname);
                await sendRemoveWordRequest(id, word);
                allWords = allWords.filter(w => String(w.id) !== String(id));
                if (paginationState.total > 0) {
                    paginationState.total -= 1;
                }
                filterWords();
                updateStats();
                showToast('删除成功');
            } catch (error) {
                console.error('删除失败:', error);
                showToast(error.message || '删除失败，请重试');
            } finally {
                restoreRemoveButton(id);
            }
        }
        
        // 删除前标记为已掌握，方便从错词本同步移除掌握状态
        async function markMasteredBeforeRemove(id, word, bookname = '') {
            const tracker = window.LearningTracker;
            if (!tracker) return;
            const bookNameSafe = bookname || document.body.dataset.bookName || '错词本';
            tracker.setBookContext({ bookName: bookNameSafe, wordBank: bookNameSafe });
            const payload = {
                wordId: id,
                wordText: word,
                bookName: bookNameSafe,
                wordBank: bookNameSafe,
                proficiencyScore: 95,
                mastered: true
            };
            try {
                await tracker.markMastery(payload);
            } catch (err) {
                console.warn('标记已掌握失败，继续删除流程', err);
            }
        }
        
        async function sendRemoveWordRequest(id, word) {
            const token = getToken();
            if (!token) throw new Error('未登录');
            
            const response = await fetch(`${API_BASE}/english/remove`, {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ id: id, word: word })
            });
            
            const result = await response.json();
            if (result.code !== 1) {
                throw new Error(result.message || '删除失败');
            }
        }
        
        function parseDateValue(rawValue) {
            if (!rawValue) return null;
            let parsed = Date.parse(rawValue);
            if (Number.isNaN(parsed)) {
                const normalized = rawValue.replace(' ', 'T').replace(/-/g, '/');
                parsed = Date.parse(normalized);
            }
            if (Number.isNaN(parsed)) {
                return null;
            }
            return new Date(parsed);
        }
        
        function formatDateValue(rawValue) {
            const date = parseDateValue(rawValue);
            if (!date) return '未知时间';
            return date.toLocaleString('zh-CN', {
                hour12: false
            });
        }
        
        function showToast(message) {
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toastMessage');
            if (!toast || !toastMessage) return;
            toastMessage.textContent = message;
            toast.classList.add('show');
            clearTimeout(showToast.timeoutId);
            showToast.timeoutId = setTimeout(() => {
                toast.classList.remove('show');
            }, 1800);
        }
        
        // 单词练习（增加错误次数）
        async function practiceWord(id, word) {
            try {
                await increaseWordTimesRequest(id);
                const wordObj = allWords.find(w => w.id === id);
                if (wordObj) {
                    wordObj.times = (wordObj.times || 1) + 1;
                    loadWords();
                }
                showToast(`已记录 "${word}" 的练习次数`);
            } catch (error) {
                console.error('练习记录失败:', error);
                showToast('练习记录失败，请稍后重试');
            }
        }
        
        async function increaseWordTimesRequest(id) {
            const token = getToken();
            if (!token) throw new Error('未登录');
            const response = await fetch(`${API_BASE}/english/wrongbook/increase?id=${id}`, {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json'
                }
            });
            const result = await response.json();
            if (result.code !== 1) {
                throw new Error(result.message || '更新失败');
            }
        }
        
        // 开始学习模式
        function startPractice() {
            ensureTrackerStarted();
            startStudySession();
        }
        
        function startStudySession() {
            const pool = allWords;
            if (!pool || pool.length === 0) {
                alert('当前筛选下暂无需要复习的错词');
                return;
            }
            studyWords = shuffleArray(pool).slice(0, Math.min(STUDY_BATCH_SIZE, pool.length));
            studyIndex = 0;
            studyStats = { completed: 0, known: 0, unknown: 0 };
            meaningRevealed = false;
            document.body.classList.add('study-lock');
            document.getElementById('studySummary').style.display = 'none';
            document.getElementById('studyActions').style.display = 'flex';
            document.getElementById('revealButton').style.display = 'inline-flex';
            document.getElementById('studyEmpty').style.display = 'none';
            document.getElementById('studyOverlay').style.display = 'flex';
            showStudyWord();
        }
        
        function showStudyWord() {
            if (!studyWords.length) {
                showStudyEmptyState();
                return;
            }
            if (studyIndex >= studyWords.length) {
                showStudySummary();
                return;
            }
            const current = studyWords[studyIndex];
            const wordEl = document.getElementById('studyWord');
            const pronounceEl = document.getElementById('studyPronounce');
            const meaningEl = document.getElementById('studyMeaning');
            const revealBtn = document.getElementById('revealButton');
            document.getElementById('studyBook').textContent = current.bookname || '自定义课本';
            document.getElementById('studyTimes').textContent = `错误 ${current.times || 1} 次`;
            document.getElementById('studyProgressText').textContent = `本轮第 ${studyIndex + 1} / ${studyWords.length} 个`;
            wordEl.textContent = current.word;
            pronounceEl.textContent = current.pronounce || '暂无音标';
            meaningEl.textContent = current.chinese || '暂无释义';
            meaningEl.style.display = 'none';
            meaningRevealed = false;
            revealBtn.style.display = 'inline-flex';
        }
        
        function revealMeaning() {
            document.getElementById('studyMeaning').style.display = 'block';
            meaningRevealed = true;
            document.getElementById('revealButton').style.display = 'none';
        }
        
        async function handleStudyResult(isKnown) {
            if (studyIndex >= studyWords.length) {
                showStudySummary();
                return;
            }
            const current = studyWords[studyIndex];
            let removedCurrentWord = false;
            if (isKnown) {
                try {
                    await sendRemoveWordRequest(current.id, current.word);
                    allWords = allWords.filter(w => String(w.id) !== String(current.id));
                    if (paginationState.total > 0) {
                        paginationState.total -= 1;
                    }
                    studyStats.known += 1;
                    removedCurrentWord = true;
                    filterWords();
                    updateStats();
                    recordWordMastery(current, true);
                } catch (error) {
                    console.error('记住单词后删除失败:', error);
                    alert(error.message || '从错词本移除失败，请稍后重试');
                    return;
                }
            } else {
                studyStats.unknown += 1;
                try {
                    await increaseWordTimesRequest(current.id);
                    const wordObj = allWords.find(w => w.id === current.id);
                    if (wordObj) {
                        wordObj.times = (wordObj.times || 1) + 1;
                    }
                    recordWordMastery(current, false);
                } catch (error) {
                    console.error(error);
                    alert('记录失败，请稍后再试');
                }
            }
            studyStats.completed += 1;
            if (removedCurrentWord) {
                studyWords.splice(studyIndex, 1);
                studyIndex = Math.max(studyIndex - 1, -1);
            }
            studyIndex += 1;
            meaningRevealed = false;
            if (studyIndex >= studyWords.length) {
                filterWords();
                updateStats();
                showStudySummary();
            } else {
                showStudyWord();
            }
        }
        
        function showStudySummary() {
            document.getElementById('studyActions').style.display = 'none';
            document.getElementById('revealButton').style.display = 'none';
            document.getElementById('studyMeaning').style.display = 'none';
            const summary = document.getElementById('studySummary');
            const completed = studyStats.completed;
            summary.innerHTML = `
                <strong>本轮已完成 ${completed} 个错词</strong>
                <p>记住 ${studyStats.known} 个 · 待加强 ${studyStats.unknown} 个</p>
                <button class="btn btn-success" style="margin-top:15px;" onclick="startStudySession()">
                    <i class="fas fa-redo"></i> 继续下一轮
                </button>
                <button class="btn btn-danger" style="margin-top:10px;" onclick="closeStudySession()">
                    <i class="fas fa-door-open"></i> 返回列表
                </button>
            `;
            summary.style.display = 'block';
        }
        
        function showStudyEmptyState() {
            document.getElementById('studyWordBlock').style.display = 'none';
            document.getElementById('studyActions').style.display = 'none';
            document.getElementById('studySummary').style.display = 'none';
            document.getElementById('studyEmpty').style.display = 'block';
        }
        
        function closeStudySession() {
            document.getElementById('studyOverlay').style.display = 'none';
            document.body.classList.remove('study-lock');
            document.getElementById('studyWordBlock').style.display = 'block';
            document.getElementById('studyActions').style.display = 'flex';
            document.getElementById('studySummary').style.display = 'none';
            document.getElementById('studyEmpty').style.display = 'none';
            document.getElementById('revealButton').style.display = 'inline-flex';
            document.getElementById('studyMeaning').style.display = 'none';
            endTrackerSession();
        }
        
        function shuffleArray(arr) {
            const clone = [...arr];
            for (let i = clone.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [clone[i], clone[j]] = [clone[j], clone[i]];
            }
            return clone;
        }
        
        // 刷新数据
        function refreshData() {
            loadWords();
            loadBooks();
        }
        
        // 显示加载状态
        function showLoading(show) {
            document.getElementById('loading').style.display = show ? 'flex' : 'none';
        }
        
        // 显示空状态
        function showEmpty() {
            document.getElementById('wordGrid').style.display = 'none';
            document.getElementById('emptyState').style.display = 'block';
        }
        
        // 格式化日期
        function formatDate(dateString) {
            if (!dateString) return '未知时间';
            
            const date = new Date(dateString);
            const now = new Date();
            const diff = now - date;
            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            
            if (days === 0) return '今天';
            if (days === 1) return '昨天';
            if (days < 7) return `${days}天前`;
            
            return date.toLocaleDateString('zh-CN');
        }
    </script>
    
    <!-- 鉴权与用户信息组件 -->
    <script src="/assets/js/auth-guard.js"></script>
