<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>单词记忆泡泡大冒险</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #333;
            overflow: auto;
        }
        
        .container {
            max-width: 1000px;
            width: 100%;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            overflow: visible;
            position: relative;
            z-index: 1;
            margin: 20px auto;
        }
        
        .header {
            background: linear-gradient(135deg, #4a6ee0 0%, #6a11cb 100%);
            color: white;
            padding: 25px;
            text-align: center;
            position: relative;
            overflow: hidden;
            z-index: 1;
            border-radius: 15px 15px 0 0;
        }
        
        .header::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
            animation: pulse 8s infinite linear;
        }
        
        .header h1 {
            font-size: 2.2em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
            letter-spacing: 1px;
            position: relative;
            z-index: 1;
        }
        
        .header p {
            font-size: 1.1em;
            opacity: 0.9;
            max-width: 600px;
            margin: 0 auto;
            line-height: 1.6;
            position: relative;
            z-index: 1;
        }
        
        .stats-bar {
            display: flex;
            justify-content: space-around;
            padding: 15px;
            background-color: #f0f4ff;
            border-bottom: 1px solid #ddd;
            font-weight: bold;
            color: #2c3e50;
            flex-wrap: wrap;
        }
        
        .stat-box {
            text-align: center;
            padding: 10px;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 3px 6px rgba(0,0,0,0.1);
            min-width: 120px;
            margin: 5px;
        }
        
        .stat-value {
            font-size: 1.8em;
            color: #3498db;
        }
        
        .stat-label {
            font-size: 0.9em;
            color: #7f8c8d;
        }
        
        .control-panel {
            padding: 25px;
            background-color: #f8f9fa;
            border-bottom: 1px solid #eee;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
            align-items: center;
        }
        
        .input-group {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        /* .number-input {
            padding: 14px;
            border: 2px solid #4facfe;
            border-radius: 10px;
            font-size: 1.1em;
            outline: none;
            width: 120px;
            text-align: center;
        }
        
        .number-input:focus {
            border-color: #00f2fe;
            box-shadow: 0 0 0 3px rgba(79, 172, 254, 0.2);
        } */

        .number-input {
            padding: 12px 16px;
            border: 2px solid #4facfe;
            border-radius: 8px;
            font-size: 1.1em;
            outline: none;
            width: 80px;
            text-align: center;
            background: white;
            box-shadow: 0 2px 8px rgba(79, 172, 254, 0.2);
            transition: all 0.3s ease;
        }
        .number-input:focus {
            border-color: #00f2fe;
            box-shadow: 0 0 0 3px rgba(79, 172, 254, 0.3);
            transform: translateY(-2px);
        }
        
        .btn {
            padding: 14px 24px;
            border: none;
            border-radius: 10px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            color: white;
        }
        
        .btn-secondary {
            background: linear-gradient(135deg, #ff9a9e, #fad0c4);
            color: white;
        }
        
        .btn-success {
            background: linear-gradient(135deg, #43e97b, #38f9d7);
            color: white;
        }
        
        .btn-danger {
            background: linear-gradient(135deg, #ff758c, #ff7eb3);
            color: white;
        }
        
/* 极狐
            background: linear-gradient(135deg, #ffd166, #极狐
            color: white;
        } */
        
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 7px 15px rgba(0,0,0,0.1);
        }
        
        .btn:active {
            transform: translateY(1px);
        }
        
        .game-container {
            position: relative;
            min-height: 400px;
            height: 50vh;
            max-height: 500px;
            overflow: hidden;
            background: linear-gradient(135deg, #a1c4fd, #c2e9fb);
        }
        
        .center-word {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 2.5em;
            font-weight: bold;
            color: #2c3e50;
            text-align: center;
            padding: 20px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            z-index: 10;
            min-width: 250px;
            max-width: 90%;
        }
        
        .bubble {
            position: absolute;
            padding: 12px 20px;
            border-radius: 50%; /* 改为球形 */
            background: rgba(255, 255, 255, 0.7); /* 半透明效果 */
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            cursor: pointer;
            transition: transform 0.2s, background-color 0.3s;
            font-size: 1.1em;
            font-weight: bold;
            z-index: 5;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            min-width: 80px; /* 最小宽度 */
            min-height: 80px; /* 保证球形 */
            max-width: 200px; /* 最大宽度 */
            word-break: break-word; /* 长文本换行 */
        }
        
        .bubble:hover {
            transform: scale(1.1);
            background: rgba(255, 255, 255, 0.9); /* 悬停时增加透明度 */
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        }
        
        .bubble.correct {
            background: rgba(67, 233, 123, 0.7); /* 半透明绿色 */
            color: white;
            animation: pop 0.5s forwards;
        }

        .bubble.wrong {
            background: rgba(255, 117, 140, 0.7); /* 半透明红色 */
            color: white;
            animation: shake 0.5s forwards;
        }
        
        .correct-hint {
            padding: 10px 20px;
            border-radius: 20px;
            background: rgba(46, 204, 113, 0.9); /* 绿色背景 */
            color: white;
            font-size: 1.3em;
            font-weight: bold;
            z-index: 15;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            animation: pulse 1s infinite;
            white-space: nowrap; /* 防止换行 */
        }

        .timer-container {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 12px 20px;
            border-radius: 30px;
            font-weight: bold;
            font-size: 1.3em;
            z-index: 20;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
        
        .timer-warning {
            animation: pulse 1s infinite;
            background: linear-gradient(135deg, #ff758c, #ff7eb3);
        }
        
        .game-over {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            z-index: 100;
            text-align: center;
        }
        
        .game-over h2 {
            font-size: 2.5em;
            margin-bottom: 20px;
            color: #ffd166;
        }
        
        .game-over p {
            font-size: 1.3em;
            margin-bottom: 30px;
        }
        
        .mode-selector {
            display: flex;
            gap: 10px;
            margin-top: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        .mode-btn {
            padding: 12px 20px;
            border-radius: 30px;
            background: #ecf0f1;
            border: 2px solid #bdc3c7;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
        }
        
        .mode-btn.active {
            background: #3498db;
            color: white;
            border-color: #2980b9;
        }
        
        .explosion {
            position: absolute;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #ffd166;
            box-shadow: 0 0 20px #ff9e01;
            opacity: 0;
            z-index: 4;
            pointer-events: none;
        }
        
        .buttons-container {
            padding: 20px;
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }
        
        .progress-container {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            height: 10px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 5px;
            z-index: 10;
        }
        
        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #4facfe, #00f2fe);
            border-radius: 5px;
            transition: width 0.3s ease;
        }
        
        .progress-text {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            color: #2c3e50;
            font-weight: bold;
            font-size: 1.1em;
            text-shadow: 0 1极狐 1px rgba(255, 255, 255, 0.8);
        }
        
        @keyframes gradientBG {
            0% { background-position: 0% 50% }
            50% { background-position: 100% 50% }
            100% { background-position: 0% 50% }
        }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        
        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(0); opacity: 0; }
        }
        
        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            50% { transform: translateX(10px); }
            75% { transform: translateX(-10px); }
            100% { transform: translateX(0); }
        }
        
        @keyframes explode {
            0% { transform: scale(0); opacity: 1; }
            50% { transform: scale(3); opacity: 0.7; }
            100% { transform: scale(5); opacity: 0; }
        }
        
        @keyframes float {
            0% { transform: translateY(0) translateX(0); }
            50% { transform: translateY(-20px) translateX(10px); }
            100% { transform: translateY(0) translateX(0); }
        }
        
        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.8em;
            }
            
            .stats-bar {
                flex-direction: row;
                gap: 5px;
            }
            
            .stat-box {
                min-width: 90px;
                padding: 8px;
            }
            
            .stat-value {
                font-size: 1.5em;
            }
            
            .btn {
                padding: 12px 18px;
                font-size: 1em;
            }
            
            .center-word {
                font-size: 2em;
                min-width: 200px;
                padding: 15px;
            }
            
            .bubble {
                padding: 10px 16px;
                font-size: 1em;
                min-width: 70px;
                min-height: 70px;
                max-width: 150px;
            }
            
            .game-container {
                height: 40vh;
                min-height: 350px;
            }
            
            .timer-container {
                font-size: 1.1em;
                padding: 10px 16px;
            }
            
            .mode-btn {
                padding: 10px 16px;
                font-size: 0.9em;
            }
        }
        
        @media (max-width: 480px) {
            body {
                padding: 10px;
            }
            
            .container {
                border-radius: 15px;
            }
            
            .header {
                padding: 15px;
            }
            
            .header h1 {
                font-size: 1.5em;
            }
            
            .header p {
                font-size: 0.9em;
            }
            
            .control-panel {
                padding: 15px;
            }
            
            .number-input {
                width: 100px;
                padding: 12px;
            }
            
            .game-container {
                height: 35vh;
                min-height: 300px;
            }
            
            .center-word {
                font-size: 1.7em;
                min-width: 180px;
            }
            
            .stat-box {
                min-width: 70px;
                padding: 5px;
            }
            
            .stat-value {
                font-size: 1.3em;
            }
            
            .stat-label {
                font-size: 0.8em;
            }
        }
    </style>
</head>
<body data-require-auth="true">
    <div class="container">
        <div class="header">
            <h1>🎮 单词泡泡龙</h1>
            <p>在泡泡海洋中挑战你的词汇记忆能力！</p>
        </div>
        
        <div class="stats-bar">
            <div class="stat-box">
                <div class="stat-value" id="score">0</div>
                <div class="stat-label">得分</div>
            </div>
            <div class="stat-box">
                <div class="stat-value" id="correct-count">0</div>
                <div class="stat-label">正确</div>
            </div>
            <div class="stat-box">
                <div class="stat-value" id="wrong-count">0</div>
                <div class="stat-label">错误</div>
            </div>
            <div class="stat-box">
                <div class="stat-value" id="streak">0</div>
                <div class="stat-label">连胜</div>
            </div>
        </div>
        
        <div class="control-panel">
            <div class="input-group">
                <input 
                    type="number" 
                    id="startIndexInput" 
                    class="number-input" 
                    placeholder="起始编号" 
                    min="0" 
                    value="0"
                >
                <span>至</span>
                <input 
                    type="number" 
                    id="endIndexInput" 
                    class="number-input" 
                    placeholder="结束编号" 
                    min="1" 
                    value="10"
                >
            </div>
            
            <div class="input-group">
                <label for="optionCount" style="font-weight: bold; color: #2c3e50;">选项数量:</label>
                <input 
                    type="number" 
                    id="optionCount" 
                    class="number-input" 
                    min="2" 
                    max="8" 
                    value="4"
                >
            </div>
            
            <div class="mode-selector">
                <div class="mode-btn active" data-mode="word-to-chinese">
                    <i class="fas fa-language"></i> 单词→中文
                </div>
                <div class="mode-btn" data-mode="chinese-to-word">
                    <i class="fas fa-exchange-alt"></i> 中文→单词
                </div>
            </div>
            
            <button id="startGameBtn" class="btn btn-primary">
                <span>🚀🚀 开始游戏</span>
            </button>
            
            <!-- 添加音乐控制按钮 -->
            <div class="music-control">
                <button id="playMusicBtn" class="btn btn-secondary">
                    <span>🎵 播放音乐</span>
                </button>
                <button id="pauseMusicBtn" class="btn btn-secondary" style="display: none;">
                    <span>⏸ 暂停音乐</span>
                </button>
            </div>
        </div>
        
        <div class="game-container" id="gameContainer">
            <div class="timer-container" id="timer">60.00秒</div>
            <div class="progress-text" id="progressText">0/0</div>
            <div class="progress-container">
                <div class="progress-bar" id="progressBar"></div>
            </div>
            
            <div class="center-word" id="centerWord">准备开始游戏...</div>
            
            <!-- 泡泡会通过JS动态生成 -->
        </div>
        
        <div class="buttons-container">
            <button id="continueBtn" class="btn btn-success" style="display: none;">
                <span>⏯⏯⏯️ 继续游戏</span>
            </button>
            <button id="restartBtn" class="btn btn-warning">
                <span>🔄🔄 重新开始</span>
            </button>
        </div>
    </div>

    <!-- 添加音频元素 -->
    <audio id="backgroundMusic" loop>
        <source src="./audio/music.mp3" type="audio/mpeg">
        您的浏览器不支持音频元素。
    </audio>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 游戏元素
            const startIndexInput = document.getElementById('startIndexInput');
            const endIndexInput = document.getElementById('endIndexInput');
            const optionCountInput = document.getElementById('optionCount');
            const startGameBtn = document.getElementById('startGameBtn');
            const continueBtn = document.getElementById('continueBtn');
            const restartBtn = document.getElementById('restartBtn');
            const gameContainer = document.getElementById('gameContainer');
            const centerWord = document.getElementById('centerWord');
            const timerDisplay = document.getElementById('timer');
            const scoreDisplay = document.getElementById('score');
            const correctCountDisplay = document.getElementById('correct-count');
            const wrongCountDisplay = document.getElementById('wrong-count');
            const streakDisplay = document.getElementById('streak');
            const modeBtns = document.querySelectorAll('.mode-btn');
            const progressText = document.getElementById('progressText');
            const progressBar = document.getElementById('progressBar');
            
            // 添加音乐控制元素
            const backgroundMusic = document.getElementById('backgroundMusic');
            const playMusicBtn = document.getElementById('playMusicBtn');
            const pauseMusicBtn = document.getElementById('pauseMusicBtn');
            
            // 游戏状态
            const API_BASE = 'http://localhost:8080';

        function buildAuthHeaders() {
            const token = localStorage.getItem('auth_token');
            return token ? { 'Authorization': `Bearer ${token}` } : {};
        }

        let words = [];
            let usedWords = [];
            let wrongWords = [];
            let currentWord = null;
            let gameActive = false;
            let timer;
            let timeLeft = 60;
            let startTime;
            let score = 0;
            let correctCount = 0;
            let wrongCount = 0;
            let currentStreak = 0;
            let bestStreak = 0;
            let gameMode = 'word-to-chinese';
            let totalWords = 0;
            let completedWords = 0;
            let lastExplosionTime = 0;
            
            // 安全区域（避免选项出现在单词下方）
            let safeZone = {
                x: 0,
                y: 0,
                width: 300,
                height: 200
            };
            
            // 初始化游戏
            function initGame() {
                const startIndex = parseInt(startIndexInput.value);
                const endIndex = parseInt(endIndexInput.value);
                
                if (isNaN(startIndex) || startIndex < 0) {
                    alert('请输入有效的起始编号（≥0）');
                    return false;
                }
                
                if (isNaN(endIndex) || endIndex <= startIndex) {
                    alert('结束编号必须大于起始编号');
                    return false;
                }
                
                const headers = buildAuthHeaders();
                if (!headers.Authorization) {
                    centerWord.textContent = "登录状态已失效，请重新登录";
                    window.location.href = '/login';
                    return false;
                }

                // 获取课本名称参数
                const urlParams = new URLSearchParams(window.location.search);
                const bookname = urlParams.get('bookname');
                
                // 显示加载状态
                centerWord.textContent = "正在加载词汇数据...";
                
                // 构建带参数的URL
                let url = `${API_BASE}/english/list?start=${startIndex}&end=${endIndex}`;
                if (bookname) {
                    url += `&bookname=${encodeURIComponent(bookname)}`;
                }
                
                fetch(url, { headers })
                    .then(response => {
                        if (!response.ok) {
                            throw new Error(`HTTP错误! 状态: ${response.status}`);
                        }
                        return response.json();
                    })
                    .then(data => {
                        if (data.code !== 1 || !data.data || data.data.length === 0) {
                            centerWord.textContent = "暂无词汇数据";
                            return;
                        }
                        
                        words = data.data;
                        totalWords = words.length;
                        completedWords = 0;
                        updateProgress();
                        usedWords = [];
                        wrongWords = [];
                        
                        startGame();
                    })
                    .catch(error => {
                        console.error('获取数据失败:', error);
                        centerWord.textContent = "数据加载失败";
                    });
                    
                return true;
            }
            
            // 开始游戏
            function startGame() {
                resetGameStats();
                gameActive = true;
                startGameBtn.style.display = 'none';
                continueBtn.style.display = 'none';
                lastExplosionTime = 0;
                
                // 更新安全区域位置
                updateSafeZone();
                
                // 开始计时
                startTimer();
                
                // 生成下一个单词
                generateNextWord();
            }
            
            // 更新安全区域（避免选项出现在单词下方）
            function updateSafeZone() {
                const rect = centerWord.getBoundingClientRect();
                const containerRect = gameContainer.getBoundingClientRect();
                
                safeZone = {
                    x: rect.left - containerRect.left - 50,
                    y: rect.top - containerRect.top - 50,
                    width: rect.width + 100,
                    height: rect.height + 100
                };
            }
            
            // 检查位置是否在安全区域内
            function isInSafeZone(x, y) {
                return (
                    x > safeZone.x && 
                    x < safeZone.x + safeZone.width &&
                    y > safeZone.y &&
                    y < safeZone.y + safeZone.height
                );
            }
            
            // 继续游戏
            function continueGame() {
                gameActive = true;
                continueBtn.style.display = 'none';
                timeLeft = 60;
                startTimer();
                generateNextWord();
            }
            
            // 重置游戏统计
            function resetGameStats() {
                score = 0;
                correctCount = 0;
                wrongCount = 0;
                currentStreak = 0;
                bestStreak = 0;
                timeLeft = 60;
                completedWords = 0;
                
                updateStats();
                updateTimerDisplay();
                updateProgress();
            }
            
            // 更新进度
            function updateProgress() {
                const progress = totalWords > 0 ? Math.round((completedWords / totalWords) * 100) : 0;
                progressBar.style.width = `${progress}%`;
                progressText.textContent = `${completedWords}/${totalWords}`;
            }
            
            // 开始计时器
            function startTimer() {
                startTime = Date.now();
                updateTimerDisplay();
                
                function update() {
                    if (!gameActive) return;
                    
                    const elapsed = (Date.now() - startTime) / 1000;
                    timeLeft = Math.max(0, 60 - elapsed);
                    
                    updateTimerDisplay();
                    
                    // 最后10秒警告（控制频率）
                    if (timeLeft <= 10) {
                        timerDisplay.classList.add('timer-warning');
                        
                        const now = Date.now();
                        if (now - lastExplosionTime > 2000) { // 每2秒一个爆炸
                            createExplosion();
                            lastExplosionTime = now;
                        }
                    } else {
                        timerDisplay.classList.remove('timer-warning');
                    }
                    
                    if (timeLeft <= 0) {
                        endGame('时间结束');
                        return;
                    }
                    
                    requestAnimationFrame(update);
                }
                
                update();
            }
            
            // 更新计时器显示
            function updateTimerDisplay() {
                timerDisplay.textContent = `${timeLeft.toFixed(2)}秒`;
            }
            
            // 生成下一个单词
            function generateNextWord() {
                // 检查游戏结束条件
                if (completedWords >= totalWords && wrongWords.length === 0) {
                    endGame('所有单词已完成');
                    return;
                }
                
                // 清除所有泡泡
                clearBubbles();
                
                // 更新安全区域位置
                updateSafeZone();
                
                // 优先从错误单词中选择
                if (wrongWords.length > 0) {
                    currentWord = wrongWords.pop();
                } else {
                    // 从剩余单词中随机选择
                    const availableWords = words.filter(word => !usedWords.includes(word.id));
                    
                    if (availableWords.length === 0) {
                        endGame('所有单词已完成');
                        return;
                    }
                    
                    const randomIndex = Math.floor(Math.random() * availableWords.length);
                    currentWord = availableWords[randomIndex];
                    usedWords.push(currentWord.id);
                }
                
                // 显示中心单词
                if (gameMode === 'word-to-chinese') {
                    centerWord.textContent = currentWord.word;
                } else {
                    centerWord.textContent = currentWord.chinese;
                }
                
                // 生成泡泡选项
                generateBubbles();
            }
            
            // 生成泡泡选项
            function generateBubbles() {
                const optionCount = parseInt(optionCountInput.value);
                if (isNaN(optionCount) || optionCount < 2) return;
                
                // 获取所有单词（除了当前单词）
                const otherWords = words.filter(word => word.id !== currentWord.id);
                
                // 随机选择错误选项
                const wrongOptions = [];
                const shuffledWords = [...otherWords];
                shuffleArray(shuffledWords);
                
                for (let i = 0; i < Math.min(optionCount - 1, shuffledWords.length); i++) {
                    wrongOptions.push(shuffledWords[i]);
                }
                
                // 创建正确选项
                const correctOption = document.createElement('div');
                correctOption.className = 'bubble';
                if (gameMode === 'word-to-chinese') {
                    correctOption.textContent = currentWord.chinese;
                } else {
                    correctOption.textContent = currentWord.word;
                }
                correctOption.dataset.correct = 'true';
                
                // 创建错误选项
                const optionElements = wrongOptions.map(option => {
                    const bubble = document.createElement('div');
                    bubble.className = 'bubble';
                    if (gameMode === 'word-to-chinese') {
                        bubble.textContent = option.chinese;
                    } else {
                        bubble.textContent = option.word;
                    }
                    bubble.dataset.correct = 'false';
                    return bubble;
                });
                
                // 添加正确选项
                optionElements.push(correctOption);
                
                // 随机排序选项
                shuffleArray(optionElements);
                
                // 定位泡泡（避开安全区域）
                positionBubbles(optionElements);
            }
            
            // 定位泡泡（避开安全区域）
            function positionBubbles(bubbles) {
                const positions = []; 
                const containerRect = gameContainer.getBoundingClientRect();
                const padding = 20; // 避免太靠近边缘
                
                bubbles.forEach((bubble, index) => {
                    let position;
                    let overlap;
                    let attempts = 0;
                    // 根据内容动态调整泡泡大小
                    const textLength = bubble.textContent.length;
                    const bubbleSize = Math.max(80, Math.min(150, textLength * 10)); // 根据文本长度调整大小
                    const bubbleWidth = bubbleSize;
                    const bubbleHeight = bubbleSize;
                    
                    do {
                        overlap = false;
                        
                        // 随机位置（确保在容器内）
                        const top = padding + Math.random() * (containerRect.height - padding * 2 - bubbleHeight);
                        const left = padding + Math.random() * (containerRect.width - padding * 2 - bubbleWidth);
                        
                        position = { top, left };
                        
                        // 检查是否在安全区域内
                        if (isInSafeZone(left + bubbleWidth/2, top + bubbleHeight/2)) {
                            overlap = true;
                            continue;
                        }
                        
                        // 检查是否与其他泡泡重叠
                        for (const otherPos of positions) {
                            const dx = otherPos.left - left;
                            const dy = otherPos.top - top;
                            const distance = Math.sqrt(dx * dx + dy * dy);
                            
                            // 如果距离小于120px，认为重叠
                            if (distance < 120) {
                                overlap = true;
                                break;
                            }
                        }
                        
                        attempts++;
                    } while (overlap && attempts < 100);
                    
                    positions.push(position);
                    
                    // 设置泡泡位置
                    Object.assign(bubble.style, {
                        top: `${position.top}px`,
                        left: `${position.left}px`,
                        position: 'absolute'
                    });
                    
                    // 添加浮动动画
                    bubble.style.animation = `float ${3 + Math.random() * 2}s infinite ease-in-out`;
                    bubble.style.animationDelay = `${index * 0.2}s`;
                    
                    // 添加点击事件
                    bubble.addEventListener('click', handleBubbleClick);
                    
                    gameContainer.appendChild(bubble);
                });
            }
            
            // 处理泡泡点击
            function handleBubbleClick(e) {
                if (!gameActive) return;
                
                const bubble = e.target;
                const isCorrect = bubble.dataset.correct === 'true';
                
                if (isCorrect) {
                    // 正确答案
                    bubble.classList.add('correct');
                    score += 10;
                    correctCount++;
                    currentStreak++;
                    completedWords++;
                    
                    if (currentStreak > bestStreak) {
                        bestStreak = currentStreak;
                    }
                    
                    // 连击奖励
                    if (currentStreak >= 3) {
                        score += currentStreak * 2;
                    }
                    
                    // 延迟后进入下一个单词
                    setTimeout(() => {
                        generateNextWord();
                        updateProgress();
                    }, 300);
                } else {
                    // 错误答案
                    bubble.classList.add('wrong');
                    wrongCount++;
                    currentStreak = 0;
                    
                    // 在中心单词下方显示绿色正确答案提示
                    const correctAnswerText = gameMode === 'word-to-chinese' 
                        ? currentWord.chinese 
                        : currentWord.word;
                    
                    // 创建提示元素
                    const correctHint = document.createElement('div');
                    correctHint.className = 'correct-hint';
                    correctHint.textContent = `正确答案: ${correctAnswerText}`;
                    
                    // 将提示添加到游戏容器中
                    gameContainer.appendChild(correctHint);
                    
                    // 定位在中心单词下方
                    const centerRect = centerWord.getBoundingClientRect();
                    const containerRect = gameContainer.getBoundingClientRect();
                    const top = centerRect.bottom - containerRect.top + 10;
                    const left = centerRect.left - containerRect.left;
                    
                    Object.assign(correctHint.style, {
                        top: `${top}px`,
                        left: `${left}px`,
                        position: 'absolute'
                    });
                    
                    // 将当前单词添加到错误单词列表（随机位置）
                    const randomIndex = Math.floor(Math.random() * (wrongWords.length + 1));
                    wrongWords.splice(randomIndex, 0, currentWord);
                    
                    // 延迟后进入下一个单词
                    setTimeout(() => {
                        correctHint.remove();
                        generateNextWord();
                    }, 1500);
                }
                
                updateStats();
            }
            
            // 清除所有泡泡
            function clearBubbles() {
                const bubbles = document.querySelectorAll('.bubble');
                bubbles.forEach(bubble => bubble.remove());
            }
            
            // 创建爆炸效果
            function createExplosion() {
                if (timeLeft > 0 && timeLeft <= 10) {
                    const explosion = document.createElement('div');
                    explosion.className = 'explosion';
                    
                    // 随机位置
                    explosion.style.left = `${Math.random() * 100}%`;
                    explosion.style.top = `${Math.random() * 100}%`;
                    
                    gameContainer.appendChild(explosion);
                    
                    // 启动爆炸动画
                    explosion.style.animation = `explode 0.5s forwards`;
                    
                    // 动画结束后移除元素
                    setTimeout(() => {
                        explosion.remove();
                    }, 500);
                }
            }
            
            // 更新统计信息
            function updateStats() {
                scoreDisplay.textContent = score;
                correctCountDisplay.textContent = correctCount;
                wrongCountDisplay.textContent = wrongCount;
                streakDisplay.textContent = currentStreak;
            }
            
            // 结束游戏
            function endGame(reason) {
                gameActive = false;
                timerDisplay.classList.remove('timer-warning');
                
                // 显示游戏结束信息
                const gameOverDiv = document.createElement('div');
                gameOverDiv.className = 'game-over';
                
                let title, message;
                if (reason === '时间结束') {
                    title = '时间到！';
                    message = `时间结束了，你完成了 ${completedWords}/${totalWords} 个单词`;
                } else {
                    title = '挑战完成！';
                    message = `恭喜！你完成了所有 ${totalWords} 个单词`;
                }
                
                gameOverDiv.innerHTML = `
                    <h2>${title}</h2>
                    <p>${message}</p>
                    <p>最终得分: ${score}</p>
                    <p>正确: ${correctCount} | 错误: ${wrongCount}</p>
                    <p>最长连胜: ${bestStreak}</p>
                `;
                
                gameContainer.appendChild(gameOverDiv);
                
                // 显示继续游戏按钮
                continueBtn.style.display = 'inline-block';
                startGameBtn.style.display = 'none';
                
                // 3秒后自动移除游戏结束信息
                setTimeout(() => {
                    gameOverDiv.remove();
                }, 3000);
            }
            
            // 工具函数：随机打乱数组
            function shuffleArray(array) {
                for (let i = array.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [array[i], array[j]] = [array[j], array[i]];
                }
            }
            
            // 事件监听器
            startGameBtn.addEventListener('click', function() {
                if (initGame()) {
                    startGameBtn.style.display = 'none';
                }
            });
            
            continueBtn.addEventListener('click', continueGame);
            
            restartBtn.addEventListener('click', function() {
                // 清除游戏区域
                clearBubbles();
                const gameOverDiv = document.querySelector('.game-over');
                if (gameOverDiv) gameOverDiv.remove();
                
                // 重新初始化游戏
                if (initGame()) {
                    continueBtn.style.display = 'none';
                }
            });
            
            // 模式切换
            modeBtns.forEach(btn => {
                btn.addEventListener('click', function() {
                    modeBtns.forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    gameMode = this.dataset.mode;
                });
            });
            
            // 添加音乐控制事件监听器
            playMusicBtn.addEventListener('click', function() {
                backgroundMusic.play();
                playMusicBtn.style.display = 'none';
                pauseMusicBtn.style.display = 'inline-block';
            });
            
            pauseMusicBtn.addEventListener('click', function() {
                backgroundMusic.pause();
                pauseMusicBtn.style.display = 'none';
                playMusicBtn.style.display = 'inline-block';
            });
            
        });
    </script>
    <script src="/assets/js/auth-guard.js"></script>
</body>
