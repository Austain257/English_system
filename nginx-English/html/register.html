<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户注册 - 英语智学平台</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
            background: radial-gradient(circle at top, #5a62f0, #1a1f35 60%);
            min-height: 100vh;
            color: #0d1c2e;
        }

        .layout {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 32px 60px 10px;
            color: #fff;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-logo {
            width: 48px;
            height: 48px;
            border-radius: 16px;
            background: rgba(255,255,255,0.12);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.4rem;
        }

        .brand h1 {
            font-size: 1.4rem;
            font-weight: 600;
        }

        .nav-links {
            display: flex;
            gap: 24px;
        }

        .nav-links a {
            color: rgba(255,255,255,0.85);
            text-decoration: none;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            font-size: 0.9rem;
            transition: color 0.2s ease;
        }

        .nav-links a:hover {
            color: #fff;
        }

        .content {
            flex: 1;
            display: grid;
            grid-template-columns: minmax(320px, 1fr) minmax(340px, 460px);
            gap: 48px;
            padding: 20px 60px 60px;
        }

        .value-panel {
            color: #fff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 28px;
        }

        .value-panel h2 {
            font-size: clamp(2.6rem, 4vw, 3.6rem);
            line-height: 1.2;
        }

        .value-panel p {
            font-size: 1.1rem;
            opacity: 0.85;
            line-height: 1.7;
        }

        .value-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 14px;
        }

        .value-item {
            background: rgba(255,255,255,0.08);
            border-radius: 20px;
            padding: 18px;
            backdrop-filter: blur(6px);
        }

        .value-item strong {
            display: block;
            font-size: 1.1rem;
            margin-bottom: 6px;
        }

        .register-card {
            background: #fff;
            border-radius: 32px;
            padding: 40px;
            box-shadow: 0 25px 70px rgba(7, 17, 39, 0.25);
            display: flex;
            flex-direction: column;
            gap: 22px;
        }

        .register-card h3 {
            font-size: 1.9rem;
            color: #111b2b;
        }

        .register-card .subtitle {
            color: #6b7280;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group label {
            font-weight: 600;
            color: #223043;
        }

        .input-wrapper {
            position: relative;
        }

        .form-group input {
            width: 100%;
            padding: 14px 52px 14px 16px;
            border: 1.5px solid #d6dbe7;
            border-radius: 16px;
            font-size: 1rem;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
            background: #f9fafb;
        }

        .form-group input:focus {
            outline: none;
            border-color: #5f6bed;
            box-shadow: 0 0 0 4px rgba(95, 107, 237, 0.15);
            background: #fff;
        }

        .form-group input.error {
            border-color: #d93025;
        }

        .form-group input.success {
            border-color: #22a06b;
        }

        .input-icon,
        .validation-icon {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            color: #9ca3af;
        }

        .input-icon {
            right: 16px;
            cursor: pointer;
        }

        .validation-icon {
            right: 46px;
            display: none;
        }

        .validation-icon.success {
            color: #22a06b;
            display: block;
        }

        .field-error {
            color: #d93025;
            font-size: 0.82rem;
            display: none;
        }

        .password-strength {
            font-size: 0.82rem;
            color: #6b7280;
        }

        .strength-bar {
            height: 4px;
            background: #e2e8f0;
            border-radius: 999px;
            margin-top: 4px;
            overflow: hidden;
        }

        .strength-fill {
            height: 100%;
            border-radius: 999px;
            width: 0;
            transition: width 0.3s ease;
        }

        .password-strength.strength-weak .strength-fill { width: 33%; background: #f87171; }
        .password-strength.strength-medium .strength-fill { width: 66%; background: #fbbf24; }
        .password-strength.strength-strong .strength-fill { width: 100%; background: #34d399; }

        .register-btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 16px;
            background: linear-gradient(135deg, #5368ff, #8f6bff);
            color: #fff;
            font-size: 1.05rem;
            font-weight: 600;
            box-shadow: 0 18px 30px rgba(83, 104, 255, 0.25);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: transform 0.2s ease;
        }

        .register-btn:hover {
            transform: translateY(-2px);
        }

        .register-btn:disabled {
            opacity: 0.65;
            cursor: not-allowed;
            transform: none;
        }

        .form-links {
            text-align: center;
            font-size: 0.95rem;
            color: #6b7280;
        }

        .form-links a {
            color: #5f6bed;
            text-decoration: none;
            font-weight: 600;
        }

        .alert {
            padding: 12px 16px;
            border-radius: 14px;
            font-size: 0.9rem;
            display: none;
        }

        .alert-error {
            background: rgba(249, 97, 103, 0.12);
            color: #d93025;
        }

        .alert-success {
            background: rgba(82, 196, 26, 0.12);
            color: #2d8a1f;
        }

        .loading { display: none; }
        .loading i { animation: spin 1s linear infinite; }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 1024px) {
            .content {
                grid-template-columns: 1fr;
                padding: 20px 30px 40px;
            }

            .value-panel {
                order: 2;
            }

            .register-card {
                order: 1;
            }
        }

        @media (max-width: 640px) {
            .nav {
                flex-direction: column;
                gap: 12px;
                padding: 20px;
            }

            .content {
                padding: 20px;
            }

            .register-card {
                padding: 32px 24px;
            }
        }
    </style>
</head>
<body data-redirect-if-authed="true">
    <div class="layout">
        <nav class="nav">
            <div class="brand">
                <div class="brand-logo"><i class="fas fa-graduation-cap"></i></div>
                <div>
                    <h1>英语智学平台</h1>
                    <small style="opacity:0.8;">AI驱动 · 数据赋能的学习体验</small>
                </div>
            </div>
            <div class="nav-links">
                <a href="/landing">首页</a>
                <a href="/landing#feature">功能亮点</a>
                <a href="/login">登录</a>
            </div>
        </nav>

        <main class="content">
            <section class="value-panel">
                <h2>打造属于你的智能英语学习空间</h2>
                <p>注册后即可同步专属词库、学习记录、错词本及AI推荐课程，随时随地继续积累。</p>
                <div class="value-list">
                    <div class="value-item">
                        <strong>个性词书</strong>
                        <span>收录四六级、考研、托福，并支持自定义导入。</span>
                    </div>
                    <div class="value-item">
                        <strong>错词追踪</strong>
                        <span>云端同步错词与复习进度，智能提醒。</span>
                    </div>
                    <div class="value-item">
                        <strong>AI学习顾问</strong>
                        <span>根据习惯自动推送任务，监督坚持率。</span>
                    </div>
                </div>
            </section>

            <section class="register-card">
                <div>
                    <h3>创建新账户</h3>
                    <p class="subtitle">完善信息，开启沉浸式学习</p>
                </div>

                <div class="alert alert-error" id="errorAlert"></div>
                <div class="alert alert-success" id="successAlert"></div>

                <form id="registerForm">
                    <div class="form-group">
                        <label for="username">用户名 *</label>
                        <div class="input-wrapper">
                            <input type="text" id="username" name="username" placeholder="输入用户名" required>
                            <i class="fas fa-user input-icon"></i>
                            <i class="fas fa-check validation-icon" id="usernameValid"></i>
                        </div>
                        <div class="field-error" id="usernameError"></div>
                    </div>

                    <div class="form-group">
                        <label for="email">邮箱</label>
                        <div class="input-wrapper">
                            <input type="email" id="email" name="email" placeholder="用于找回账号（可选）">
                            <i class="fas fa-envelope input-icon"></i>
                            <i class="fas fa-check validation-icon" id="emailValid"></i>
                        </div>
                        <div class="field-error" id="emailError"></div>
                    </div>

                    <div class="form-group">
                        <label for="nickname">昵称</label>
                        <div class="input-wrapper">
                            <input type="text" id="nickname" name="nickname" placeholder="显示在学习页面">
                            <i class="fas fa-id-card input-icon"></i>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="password">密码 *</label>
                        <div class="input-wrapper">
                            <input type="password" id="password" name="password" placeholder="至少6位" required>
                            <i class="fas fa-eye password-toggle input-icon" id="passwordToggle"></i>
                        </div>
                        <div class="field-error" id="passwordError"></div>
                        <div class="password-strength" id="passwordStrength">
                            <div class="strength-bar"><div class="strength-fill"></div></div>
                            <span class="strength-text"></span>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="confirmPassword">确认密码 *</label>
                        <div class="input-wrapper">
                            <input type="password" id="confirmPassword" name="confirmPassword" placeholder="再次输入密码" required>
                            <i class="fas fa-eye password-toggle input-icon" id="confirmToggle"></i>
                            <i class="fas fa-check validation-icon" id="confirmPasswordValid"></i>
                        </div>
                        <div class="field-error" id="confirmPasswordError"></div>
                    </div>

                    <button type="submit" class="register-btn" id="registerBtn">
                        完成注册
                        <span class="loading" id="loading"><i class="fas fa-spinner"></i></span>
                    </button>
                </form>

                <div class="form-links">
                    已有账号？<a href="login.html">立即登录</a> 或 <a href="landing.html">返回首页</a>
                </div>
            </section>
        </main>
    </div>

    <script src="/assets/js/auth-guard.js"></script>
    <script>
        let validationResults = {
            username: false,
            email: true,
            password: false,
            confirmPassword: false
        };

        document.addEventListener('DOMContentLoaded', function() {
            setupPasswordToggles();
            setupFormValidation();
            setupFormSubmission();
        });

        function setupPasswordToggles() {
            setupPasswordToggle('password', 'passwordToggle');
            setupPasswordToggle('confirmPassword', 'confirmToggle');
        }

        function setupPasswordToggle(inputId, toggleId) {
            const passwordInput = document.getElementById(inputId);
            const toggleBtn = document.getElementById(toggleId);

            toggleBtn.addEventListener('click', function() {
                if (passwordInput.type === 'password') {
                    passwordInput.type = 'text';
                    toggleBtn.className = 'fas fa-eye-slash password-toggle input-icon';
                } else {
                    passwordInput.type = 'password';
                    toggleBtn.className = 'fas fa-eye password-toggle input-icon';
                }
            });
        }

        function setupFormValidation() {
            const usernameInput = document.getElementById('username');
            const emailInput = document.getElementById('email');
            const passwordInput = document.getElementById('password');
            const confirmInput = document.getElementById('confirmPassword');

            usernameInput.addEventListener('blur', validateUsername);
            usernameInput.addEventListener('input', debounce(validateUsername, 500));

            emailInput.addEventListener('blur', validateEmail);
            emailInput.addEventListener('input', debounce(validateEmail, 500));

            passwordInput.addEventListener('input', function() {
                validatePassword();
                validateConfirmPassword();
            });

            confirmInput.addEventListener('input', validateConfirmPassword);
            confirmInput.addEventListener('blur', validateConfirmPassword);
        }

        async function validateUsername() {
            const username = document.getElementById('username').value.trim();

            if (!username) {
                showFieldError('username', '用户名不能为空');
                return;
            }

            if (username.length < 3) {
                showFieldError('username', '用户名至少3个字符');
                return;
            }

            if (!/^[a-zA-Z0-9_]+$/.test(username)) {
                showFieldError('username', '用户名只能包含字母、数字和下划线');
                return;
            }

            try {
                const response = await fetch(`http://localhost:8080/user/check-username?username=${encodeURIComponent(username)}`);
                const result = await response.json();

                if (result.code === 1 && result.data === '用户名可用') {
                    showFieldSuccess('username');
                } else {
                    showFieldError('username', '用户名已存在');
                }
            } catch (error) {
                console.error('验证用户名失败:', error);
            }
        }

        async function validateEmail() {
            const email = document.getElementById('email').value.trim();

            if (!email) {
                showFieldSuccess('email');
                return;
            }

            if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                showFieldError('email', '请输入有效的邮箱地址');
                return;
            }

            try {
                const response = await fetch(`http://localhost:8080/user/check-email?email=${encodeURIComponent(email)}`);
                const result = await response.json();

                if (result.code === 1 && result.data === '邮箱可用') {
                    showFieldSuccess('email');
                } else {
                    showFieldError('email', '邮箱已被注册');
                }
            } catch (error) {
                console.error('验证邮箱失败:', error);
            }
        }

        function validatePassword() {
            const password = document.getElementById('password').value;
            const strengthContainer = document.getElementById('passwordStrength');

            if (!password) {
                showFieldError('password', '密码不能为空');
                strengthContainer.className = 'password-strength';
                return;
            }

            if (password.length < 6) {
                showFieldError('password', '密码至少6个字符');
                strengthContainer.className = 'password-strength strength-weak';
                strengthContainer.querySelector('.strength-text').textContent = '密码强度：弱';
                return;
            }

            let strength = 0;
            if (password.length >= 8) strength++;
            if (/[a-z]/.test(password)) strength++;
            if (/[A-Z]/.test(password)) strength++;
            if (/[0-9]/.test(password)) strength++;
            if (/[^a-zA-Z0-9]/.test(password)) strength++;

            hideFieldError('password');
            validationResults.password = true;

            if (strength <= 2) {
                strengthContainer.className = 'password-strength strength-weak';
                strengthContainer.querySelector('.strength-text').textContent = '密码强度：弱';
            } else if (strength <= 3) {
                strengthContainer.className = 'password-strength strength-medium';
                strengthContainer.querySelector('.strength-text').textContent = '密码强度：中等';
            } else {
                strengthContainer.className = 'password-strength strength-strong';
                strengthContainer.querySelector('.strength-text').textContent = '密码强度：强';
            }
        }

        function validateConfirmPassword() {
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (!confirmPassword) {
                showFieldError('confirmPassword', '请确认密码');
                return;
            }

            if (password !== confirmPassword) {
                showFieldError('confirmPassword', '两次输入的密码不一致');
                return;
            }

            showFieldSuccess('confirmPassword');
        }

        function showFieldError(fieldName, message) {
            const input = document.getElementById(fieldName);
            const errorElement = document.getElementById(fieldName + 'Error');
            const validIcon = document.getElementById(fieldName + 'Valid');

            input.classList.add('error');
            input.classList.remove('success');
            errorElement.textContent = message;
            errorElement.style.display = 'block';

            if (validIcon) {
                validIcon.style.display = 'none';
            }

            validationResults[fieldName] = false;
        }

        function showFieldSuccess(fieldName) {
            const input = document.getElementById(fieldName);
            const errorElement = document.getElementById(fieldName + 'Error');
            const validIcon = document.getElementById(fieldName + 'Valid');

            input.classList.add('success');
            input.classList.remove('error');
            errorElement.style.display = 'none';

            if (validIcon) {
                validIcon.classList.add('success');
                validIcon.classList.remove('error');
                validIcon.style.display = 'block';
            }

            validationResults[fieldName] = true;
        }

        function hideFieldError(fieldName) {
            const input = document.getElementById(fieldName);
            const errorElement = document.getElementById(fieldName + 'Error');

            input.classList.remove('error');
            errorElement.style.display = 'none';

            validationResults[fieldName] = true;
        }

        function setupFormSubmission() {
            const form = document.getElementById('registerForm');
            const registerBtn = document.getElementById('registerBtn');
            const loading = document.getElementById('loading');

            form.addEventListener('submit', async function(e) {
                e.preventDefault();

                await validateUsername();
                await validateEmail();
                validatePassword();
                validateConfirmPassword();

                if (!Object.values(validationResults).every(valid => valid)) {
                    showAlert('请修正所有错误后再提交', 'error');
                    return;
                }

                const formData = {
                    username: document.getElementById('username').value.trim(),
                    email: document.getElementById('email').value.trim() || null,
                    nickname: document.getElementById('nickname').value.trim() || null,
                    password: document.getElementById('password').value,
                    confirmPassword: document.getElementById('confirmPassword').value
                };

                registerBtn.disabled = true;
                loading.style.display = 'inline';
                hideAlerts();

                try {
                    const response = await fetch('http://localhost:8080/user/register', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(formData)
                    });

                    const result = await response.json();

                    if (result.code === 1) {
                        showAlert('注册成功！正在跳转到登录页面...', 'success');
                        setTimeout(() => { window.location.href = 'login.html'; }, 2000);
                    } else {
                        showAlert(result.message || '注册失败，请稍后重试', 'error');
                    }
                } catch (error) {
                    console.error('注册错误:', error);
                    showAlert('网络错误，请稍后重试', 'error');
                } finally {
                    registerBtn.disabled = false;
                    loading.style.display = 'none';
                }
            });
        }

        function showAlert(message, type) {
            hideAlerts();
            const alertElement = document.getElementById(type === 'error' ? 'errorAlert' : 'successAlert');
            alertElement.textContent = message;
            alertElement.style.display = 'block';

            if (type === 'success') {
                setTimeout(() => { alertElement.style.display = 'none'; }, 8000);
            }
        }

        function hideAlerts() {
            document.getElementById('errorAlert').style.display = 'none';
            document.getElementById('successAlert').style.display = 'none';
        }

        function debounce(func, wait) {
            let timeout;
            return function executedFunction(...args) {
                const later = () => {
                    clearTimeout(timeout);
                    func(...args);
                };
                clearTimeout(timeout);
                timeout = setTimeout(later, wait);
            };
        }
    </script>
</body>
</html>
