<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>功能选择 - 英语词汇学习系统</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            min-height: 100vh;
            padding: 0 20px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #333;
        }

        .top-bar {
            width: 100%;
            max-width: 1200px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 0 10px;
            position: relative;
            z-index: 20;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            color: #fff;
        }

        .brand-icon {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            background: rgba(255,255,255,0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
        }

        .brand h1 {
            font-size: 1.35rem;
            margin: 0;
        }

        .nav-links {
            display: flex;
            gap: 24px;
        }

        .nav-links a {
            color: rgba(255,255,255,0.85);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s ease;
        }

        .nav-links a:hover {
            color: #fff;
        }

        .user-info-slot {
            min-width: 260px;
        }
        
        .header {
            background: linear-gradient(135deg, #4a6ee0 0%, #6a11cb 100%);
            color: white;
            padding: 25px 30px;
            text-align: center;
            position: relative;
            overflow: hidden;
            margin: 30px 0;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        
        .header::before {
            content: "";
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
            animation: pulse 8s infinite linear;
        }
        
        @keyframes pulse {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .header h1 {
            font-size: 2.8rem;
            margin-bottom: 10px;
            position: relative;
            z-index: 1;
        }
        
        .header p {
            font-size: 1.2rem;
            opacity: 0.9;
            max-width: 600px;
            position: relative;
            z-index: 1;
        }
        
        .book-info {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 20px 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            text-align: center;
            max-width: 800px;
            width: 100%;
        }
        
        .book-name {
            font-size: 1.8rem;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 10px;
        }
        
        .container {
            max-width: 1200px;
            width: 100%;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 30px;
            margin: 20px 0;
        }
        
        .function-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            width: 280px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            cursor: pointer;
        }
        
        .function-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
        }
        
        .function-icon {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            color: white;
            font-size: 3rem;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
        
        .icon-1 {
            background: linear-gradient(135deg, #4facfe, #00f2fe);
        }
        
        .icon-2 {
            background: linear-gradient(135deg, #ff9a9e, #fad0c4);
        }
        
        .icon-3 {
            background: linear-gradient(135deg, #43e97b, #38f9d7);
        }
        
        .icon-4 {
            background: linear-gradient(135deg, #ff758c, #ff7eb3);
        }
        
        .icon-5 {
            background: linear-gradient(135deg, #667eea, #764ba2);
        }
        
        .function-title {
            font-size: 1.4rem;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 10px;
        }
        
        .function-desc {
            color: #7f8c8d;
            font-size: 0.95rem;
            margin-bottom: 20px;
            flex-grow: 1;
        }
        
        .loading {
            text-align: center;
            padding: 50px;
            font-size: 1.2rem;
            color: white;
        }
        
        .error {
            text-align: center;
            padding: 30px;
            font-size: 1.2rem;
            color: #ff6b6b;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            margin: 20px 0;
            max-width: 600px;
        }
        
        .back-btn {
            padding: 12px 25px;
            background: rgba(255, 255, 255, 0.95);
            border: none;
            border-radius: 30px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 20px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
        
        .back-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }
        
        @media (max-width: 768px) {
            .container {
                gap: 20px;
            }
            
            .function-card {
                width: 250px;
            }
            
            .header h1 {
                font-size: 2.2rem;
            }
        }
        
        @media (max-width: 576px) {
            .function-card {
                width: 100%;
                max-width: 320px;
            }
            
            .header h1 {
                font-size: 1.8rem;
            }
            
            .header p {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body data-require-auth="true">
    <header class="top-bar">
        <div class="brand">
            <div class="brand-icon">
                <i class="fas fa-graduation-cap"></i>
            </div>
            <div>
                <h1>英语智学平台</h1>
                <small style="color:rgba(255,255,255,0.7)">AI驱动 · 个性化学习</small>
            </div>
        </div>
        <nav class="nav-links">
            <a href="/function">功能总览</a>
            <a href="/wrongbook">错词本</a>
            <a href="/profile">个人中心</a>
        </nav>
        <div class="user-info-slot" data-user-info-anchor="true"></div>
    </header>

    <div class="header">
        <h1>英语词汇学习系统</h1>
        <p>选择您需要的学习功能</p>
    </div>
    
    <div class="book-info">
        <div class="book-name" id="bookName">加载中...</div>
        <p>请选择以下功能开始学习</p>
    </div>
    
    <div class="container" id="functionsContainer">
        <div class="loading">正在加载功能列表...</div>
    </div>
    
    <button class="back-btn" onclick="goBack()">
        <i class="fas fa-arrow-left"></i> 返回课本选择
    </button>

    <script>
        const API_BASE = 'http://localhost:8080';

        function buildAuthHeaders() {
            const token = localStorage.getItem('auth_token');
            return token ? { 'Authorization': `Bearer ${token}` } : {};
        }

        // 获取URL参数
        function getQueryParam(name) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(name);
        }
        
        // 返回课本选择页面
        function goBack() {
            window.location.href = '/allbook';
        }
        
        document.addEventListener('DOMContentLoaded', function() {
            const bookName = decodeURIComponent(getQueryParam('bookname'));
            const bookNameElement = document.getElementById('bookName');
            const functionsContainer = document.getElementById('functionsContainer');
            
            if (!bookName || bookName === 'null') {
                bookNameElement.textContent = '未指定课本';
                functionsContainer.innerHTML = '<div class="error">错误：未指定课本名称</div>';
                return;
            }
            
            bookNameElement.textContent = bookName;
            
            const headers = buildAuthHeaders();
            if (!headers.Authorization) {
                bookNameElement.textContent = '登录已失效';
                functionsContainer.innerHTML = '<div class="error">请重新登录后再访问学习工作台</div>';
                window.location.href = '/login';
                return;
            }

            // 检查课本是否存在
            fetch(`${API_BASE}/list/${encodeURIComponent(bookName)}`, { headers })
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`HTTP错误! 状态: ${response.status}`);
                    }
                    return response.json();
                })
                .then(data => {
                    if (data.code !== 1) {
                        functionsContainer.innerHTML = '<div class="error">错误：课本不存在或无法访问</div>';
                        return;
                    }
                    
                    // 渲染功能卡片
                    renderFunctionCards(bookName);
                })
                .catch(error => {
                    console.error('检查课本失败:', error);
                    functionsContainer.innerHTML = '<div class="error">错误：无法验证课本，请检查网络连接或重新登录</div>';
                });
        });
        
        function renderFunctionCards(bookName) {
            const functionsContainer = document.getElementById('functionsContainer');
            
            // 功能列表
            const functions = [
                {
                    id: 1,
                    title: '词汇背诵',
                    description: '通过卡片形式背诵单词，支持发音功能',
                    icon: '📚',
                    iconClass: 'icon-1',
                    page: 'recite'
                },
                {
                    id: 2,
                    title: '词汇学习',
                    description: '系统学习单词，包含音标和释义',
                    icon: '📖',
                    iconClass: 'icon-2',
                    page: 'english'
                },
                {
                    id: 3,
                    title: '单词选项',
                    description: '通过选择题形式巩固单词记忆',
                    icon: '❓',
                    iconClass: 'icon-3',
                    page: 'option'
                },
                {
                    id: 4,
                    title: '单词游戏',
                    description: '在趣味游戏中快速掌握单词',
                    icon: '🎮',
                    iconClass: 'icon-4',
                    page: 'game'
                },
                {
                    id: 5,
                    title: '智能错词本',
                    description: '管理错题单词，智能复习巩固',
                    icon: '📋',
                    iconClass: 'icon-5',
                    page: 'wrongbook'
                }
            ];
            
            functionsContainer.innerHTML = '';
            
            functions.forEach(func => {
                const functionCard = document.createElement('div');
                functionCard.className = 'function-card';
                functionCard.onclick = () => {
                    // 跳转到对应功能页面，传递课本名称
                    window.location.href = `/${func.page}?bookname=${encodeURIComponent(bookName)}`;
                    // window.location.href = `${func.page}`;
                };
                
                functionCard.innerHTML = `
                    <div class="function-icon ${func.iconClass}">
                        <i class="fas">${func.icon}</i>
                    </div>
                    <h3 class="function-title">${func.title}</h3>
                    <p class="function-desc">${func.description}</p>
                `;
                
                functionsContainer.appendChild(functionCard);
            });
        }
    </script>
    
    <!-- 用户信息组件与鉴权 -->
    <script src="/assets/js/auth-guard.js"></script>
    <script src="/assets/js/user-info.js"></script>
</body>
</html>
