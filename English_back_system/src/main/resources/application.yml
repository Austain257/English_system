server:
  port: 8080

spring:
  application:
    name: English_back_system
  datasource:
      driver-class-name: com.mysql.cj.jdbc.Driver
      url: jdbc:mysql://localhost:3306/english_web?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true
      username: Austain
      password: 123456


  ai:
    openai: # openai模型配置
      base-url: https://dashscope.aliyuncs.com/compatible-mode
      api-key: ${OPENAI_API_KEY} # API key配置在电脑环境变量中，使用此符号引用（如何配置看Function Calling笔记）
      chat:
        options:
          model: deepseek-v3.1
          temperature: 0.7

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
